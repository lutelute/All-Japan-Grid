<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubSLD — 変電所単線結線ビュー</title>
<style>
:root{--bg:#141417;--panel:#1f1f26;--panel2:#26262e;--txt:#f2f1ec;--mut:#9c9aa3;
 --yel:#ffd54f;--v500:#d62728;--v275:#ff7f0e;--v154:#9467bd;--v66:#17becf;--navy:#7a8ac9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
 font-family:"Hiragino Sans","Noto Sans CJK JP",sans-serif}
header{position:sticky;top:0;z-index:10;background:#141417ee;border-bottom:1px solid #333;
 padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0}
h1 small{color:var(--mut);font-weight:normal;margin-left:8px;font-size:11px}
#q{background:var(--panel2);border:1px solid #444;color:var(--txt);padding:6px 10px;
 border-radius:6px;width:240px;font-size:13px}
.chip{background:var(--panel2);border:1px solid #444;color:var(--mut);padding:3px 10px;
 border-radius:12px;font-size:12px;cursor:pointer;user-select:none}
.chip.on{background:var(--yel);color:#141417;border-color:var(--yel);font-weight:bold}
#wrap{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 54px)}
#list{overflow-y:auto;border-right:1px solid #2a2a30}
.row{padding:8px 14px;border-bottom:1px solid #222228;cursor:pointer;font-size:13px}
.row:hover{background:var(--panel)}
.row.sel{background:var(--panel2)}
.row .kv{color:var(--mut);font-size:11px;margin-top:2px}
#more{display:block;width:100%;padding:10px;background:var(--panel);color:var(--mut);
 border:none;cursor:pointer;font-size:12px}
#detail{overflow-y:auto;padding:16px 20px}
#dhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
#dname{font-size:22px;font-weight:bold}
#dmeta{color:var(--mut);font-size:12px}
.kvchip{display:inline-block;padding:1px 8px;border-radius:4px;color:#fff;
 font-size:11px;font-weight:bold;margin-right:4px}
#panes{display:grid;grid-template-columns:minmax(320px,44%) 1fr;gap:16px;align-items:start}
@media (max-width:1000px){#panes{grid-template-columns:1fr}}
.pane{background:var(--panel);border-radius:10px;overflow:hidden}
.pane h3{margin:0;padding:8px 12px;font-size:12px;color:var(--mut);font-weight:normal}
#geo{position:relative;overflow:hidden;background:#0a0a0c}
#geo img{position:absolute;width:256px;height:256px;image-rendering:auto}
#geoSvg{position:absolute;inset:0}
#attrib{position:absolute;right:4px;bottom:3px;background:#0009;color:#fff;
 font-size:9px;padding:1px 5px;border-radius:3px}
#sld{background:#fbfbf9;border-radius:0 0 10px 10px}
#legend{color:var(--mut);font-size:11px;padding:10px 4px;line-height:1.7}
#empty{color:var(--mut);padding:40px;text-align:center}
a{color:var(--navy)}
</style>
</head>
<body>
<header>
 <h1>SubSLD 変電所単線結線ビュー<small>実証ペア図・全国 <span id="cnt">…</span> 所（OSM=正・捏造ゼロ）</small></h1>
 <input id="q" placeholder="変電所名で検索（例: 新京葉）">
 <span id="roles">
  <span class="chip role on" data-role="control">制御所</span>
  <span class="chip role" data-role="dispatch">中央給電指令所</span>
 </span>
 <span id="chips"></span>
</header>
<div id="wrap">
 <nav id="list"></nav>
 <main id="detail"><div id="empty">読み込み中…</div></main>
</div>
<script>
const VC={500:"#d62728",275:"#ff7f0e",250:"#e377c2",220:"#e377c2",187:"#bcbd22",
 154:"#9467bd",132:"#8c564b",110:"#1f77b4",77:"#2ca02c",66:"#17becf",33:"#7f7f7f",
 22:"#7f7f7f",0:"#999999"};
const vcol=k=>VC[k]||"#999";
const REGIONS=["hokkaido","tohoku","tokyo","chubu","hokuriku","kansai","chugoku","shikoku","kyushu","okinawa"];
let DATA=[],FILTER={q:"",r:null},shown=0,SEL=null;
const BUILT={};  // 地域別ways(実線形)のオンデマンドキャッシュ
let RB=null;      // 地域bbox(越境ロード判定)
let LOOPS=null;   // ループ(閉路)構造。中央給電指令所ビューと制御所の注記で使う
fetch("data/loops.json?v=1").then(r=>r.json()).then(j=>{LOOPS=j;
 if(ROLE==="dispatch") showDispatch(); else if(SEL) updateOpsNote(SEL);}).catch(()=>{});
let BASE="photo"; // GeoPane基図: photo=航空写真 / map=地理院地図
// 運用ビュー(2026-08-28): 役割は2つ。
//   control  = 制御所 … 1変電所の開閉器を操作し、母線の充電状態を見る
//   dispatch = 中央給電指令所 … 全国/島を俯瞰し、開閉操作の影響範囲を見る
let ROLE="control";
let SWSTATE={};    // {site_id: {"<vl>/<i>": true(開) | false(閉)}} 平常時からの差分
const $=id=>document.getElementById(id);

fetch("data/subsld_pages.json?v=5").then(r=>r.json()).then(j=>{
 DATA=j.sites;
 DATA.forEach(s=>{s._nl=(s.n||s.i);s._pr=(Math.max(...(s.kv.length?s.kv:[0])))*100+s.vl.reduce((a,v)=>a+v.g.length,0)});
 DATA.sort((a,b)=>b._pr-a._pr);
 $("cnt").textContent=DATA.length.toLocaleString();
 const ch=$("chips");
 REGIONS.forEach(r=>{const c=document.createElement("span");c.className="chip";
  c.textContent=r;c.onclick=()=>{FILTER.r=FILTER.r===r?null:r;
   [...ch.children].forEach(x=>x.classList.toggle("on",x.textContent===FILTER.r));
   render()};ch.appendChild(c)});
 $("q").addEventListener("input",e=>{FILTER.q=e.target.value.trim();render()});
 document.querySelectorAll("#roles .role").forEach(el=>{
  el.onclick=()=>{ROLE=el.dataset.role;
   document.querySelectorAll("#roles .role").forEach(x=>x.classList.toggle("on",x===el));
   if(ROLE==="dispatch") showDispatch(); else if(SEL) select(SEL);};});
 render();
 const first=DATA[0];if(first)select(first);
});

function filtered(){return DATA.filter(s=>(!FILTER.r||s.r===FILTER.r)&&
 (!FILTER.q||s._nl.includes(FILTER.q)))}
function render(){
 const L=$("list");L.innerHTML="";shown=0;
 const f=filtered();addRows(f,L);
 if(!SEL&&f.length)select(f[0]);
}
function addRows(f,L){
 const seg=f.slice(shown,shown+250);
 seg.forEach(s=>{
  const d=document.createElement("div");d.className="row"+(SEL===s?" sel":"");
  d.innerHTML=`<div>${s._nl}</div><div class="kv">${s.r} ・ ${s.kv.join("/")||"?"}kV ・ ${s.vl.reduce((a,v)=>a+v.g.length,0)}線</div>`;
  d.onclick=()=>select(s);L.appendChild(d)});
 shown+=seg.length;
 const rest=f.length-shown;
 if(rest>0){const m=document.createElement("button");m.id="more";
  m.textContent=`さらに表示（残り ${rest.toLocaleString()} 所）`;
  m.onclick=()=>{m.remove();addRows(f,L)};L.appendChild(m)}
}

function select(s){
 SEL=s;
 [...document.querySelectorAll(".row")].forEach(r=>r.classList.remove("sel"));
 $("detail").innerHTML=`
  <div id="dhead"><span id="dname">${s._nl}</span>
   <span>${s.kv.map(k=>`<span class="kvchip" style="background:${vcol(k)}">${k}kV</span>`).join("")}</span>
   <span id="dmeta">${s.r}${s.ty?" ・ "+s.ty:""} ・ ${s.la.toFixed(4)}, ${s.lo.toFixed(4)}
    ・ <a href="https://www.openstreetmap.org/#map=17/${s.la}/${s.lo}" target="_blank">OSM</a></span></div>
  <div id="panes">
   <div class="pane"><h3>GeoPane — 構内幾何（●vertex ■polygon ▲leadin）
     <button id="baseBtn" style="float:right;background:#26262e;color:#f2f1ec;border:1px solid #444;border-radius:5px;padding:1px 10px;font-size:11px;cursor:pointer"></button></h3>
    <div id="geo"></div></div>
   <div class="pane"><h3>SLDPane — 単線結線図（上=流入/下=流出・推定、灰=対向不明、破線=leadin、二重円=変圧器）<br>
     <span style="color:#7a8ac9">制御所ビュー: □=開閉器（閉=塗り／開=斜線）をクリックで開閉。母線の明暗が充電状態</span></h3>
    <div id="sld"></div>
    <div id="opsNote" style="padding:6px 12px 10px;font-size:11px;color:var(--mut)"></div></div>
  </div>
  <div id="legend">実証ペア図（SubSLD法）: 全要素はOSMの証拠に遡れる。回線数=平行ストローク本数（下界推定・過大評価しない）。
   変圧器の無い電圧階級は「スルー」。流向は対向変電所の電圧階層による推定。<br>
   <b>GeoPaneのマーカー</b>: <span style="color:#d62728">●</span> vertex（赤）=way頂点共有の最強証拠 ／
   <span style="color:#1f77b4">■</span> polygon（青）=敷地内包（構内に多数表示されるもの） ／
   <span style="color:#ff7f0e">▲</span> leadin（橙）=引込帯の弱い証拠（縁辺に並ぶ三角）。
   いずれも白縁取りで衛星上でも視認可、端子のway端点（サイト側）に配置。
   実線形（電圧色）・敷地黄縁・地理院写真と合わせて、PNG版GeoPaneの全要素をPages上で再現している。<br>
   証拠語彙（本手法の定義・OSM仕様ではない）: <b>vertex</b>=線wayが構内wayと頂点共有（最強）／
   <b>polygon</b>=線端が敷地ポリゴン内／<b>leadin</b>=敷地外0.6km以内で途切れる引込み（弱い証拠→破線表示）。GeoPaneの線=OSM実線形（電圧階級色・無タグ=灰）。</div>`;
 drawGeo(s);drawSLD(s);updateOpsNote(s);
}

/* ---------- GeoPane: 地理院タイル + 敷地ポリゴン ---------- */
function drawGeo(s){
 const el=$("geo");const W=el.clientWidth||460,H=Math.round(W*0.95);
 el.style.height=H+"px";
 // bboxからz選択
 let la0=s.la-0.004,la1=s.la+0.004,lo0=s.lo-0.004,lo1=s.lo+0.004;
 if(s.pg){la0=Math.min(...s.pg.map(p=>p[0]))-0.0015;la1=Math.max(...s.pg.map(p=>p[0]))+0.0015;
  lo0=Math.min(...s.pg.map(p=>p[1]))-0.0015;lo1=Math.max(...s.pg.map(p=>p[1]))+0.0015}
 const t2x=(lo,z)=> (lo+180)/360*Math.pow(2,z);
 const t2y=(la,z)=>{const r=la*Math.PI/180;
  return (1-Math.asinh(Math.tan(r))/Math.PI)/2*Math.pow(2,z)};
 let z=18;
 for(;z>14;z--){if((t2x(lo1,z)-t2x(lo0,z))*256<=W*1.6&&(t2y(la0,z)-t2y(la1,z))*256<=H*1.6)break}
 const cx=t2x((lo0+lo1)/2,z),cy=t2y((la0+la1)/2,z);
 const px=x=> (x-cx)*256+W/2, py=y=> (y-cy)*256+H/2;
 el.innerHTML="";
 const x0=Math.floor(cx-W/512-1),x1=Math.ceil(cx+W/512+1);
 const y0=Math.floor(cy-H/512-1),y1=Math.ceil(cy+H/512+1);
 for(let tx=x0;tx<=x1;tx++)for(let ty=y0;ty<=y1;ty++){
  const im=document.createElement("img");
  im.src=BASE==="photo"
   ?`https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/${z}/${tx}/${ty}.jpg`
   :`https://cyberjapandata.gsi.go.jp/xyz/std/${z}/${tx}/${ty}.png`;
  im.style.left=px(tx)+"px";im.style.top=py(ty)+"px";
  el.appendChild(im)}
 const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
 svg.id="geoSvg";svg.setAttribute("width",W);svg.setAttribute("height",H);
 if(s.pg){
  const pts=s.pg.map(p=>`${px(t2x(p[1],z))},${py(t2y(p[0],z))}`).join(" ");
  svg.innerHTML=`<polygon points="${pts}" fill="none" stroke="#ffd54f" stroke-width="2.2"/>`;
 }else{
  const x=px(t2x(s.lo,z)),y=py(t2y(s.la,z));
  svg.innerHTML=`<circle cx="${x}" cy="${y}" r="10" fill="none" stroke="#ffd54f" stroke-width="2.5"/>`;
 }
 // 証拠マーカー(●vertex ■polygon ▲leadin — PNG版GeoPaneと同じ)
 if(s.tm){
  const mk=[];
  s.tm.forEach(([la,lo,b])=>{
   const x=px(t2x(lo,z)),y=py(t2y(la,z));
   if(x<-8||x>W+8||y<-8||y>H+8) return;
   if(b===0) mk.push(`<circle cx="${x}" cy="${y}" r="4.2" fill="#d62728" stroke="#fff" stroke-width="1.1"/>`);
   else if(b===1) mk.push(`<rect x="${x-3.8}" y="${y-3.8}" width="7.6" height="7.6" fill="#1f77b4" stroke="#fff" stroke-width="1.1"/>`);
   else mk.push(`<path d="M ${x} ${y-4.6} L ${x+4.2} ${y+3.6} L ${x-4.2} ${y+3.6} Z" fill="#ff7f0e" stroke="#fff" stroke-width="1.1"/>`);
  });
  svg.insertAdjacentHTML("beforeend",mk.join(""));
 }
 el.appendChild(svg);
 const a=document.createElement("div");a.id="attrib";
 a.textContent=BASE==="photo"?"出典: 地理院タイル(全国最新写真)":"出典: 地理院タイル(標準地図)";el.appendChild(a);
 const bb=document.getElementById("baseBtn");
 if(bb){bb.textContent=BASE==="photo"?"地図に切替":"写真に切替";
  bb.onclick=()=>{BASE=BASE==="photo"?"map":"photo";drawGeo(s)};}
 // 送電線オーバーレイ: 生のOSM実線形(簡約済み)を重畳。
 // builtのpathは途中切れがあり端点補完すると偽の直線(スターバースト)になるため使わない
 const mla0=la0-0.012,mla1=la1+0.012,mlo0=lo0-0.012,mlo1=lo1+0.012;
 const drawLines=(ways)=>{
  if(SEL!==s) return;
  const frag=[];
  ways.forEach(([k,pth])=>{
   if(!pth.some(pt=>pt[0]>=mla0&&pt[0]<=mla1&&pt[1]>=mlo0&&pt[1]<=mlo1)) return;
   const pts=pth.map(pt=>`${px(t2x(pt[1],z)).toFixed(1)},${py(t2y(pt[0],z)).toFixed(1)}`).join(" ");
   const w=k>=187?2.8:(k?2:1.6);
   frag.push(`<polyline points="${pts}" fill="none" stroke="#000" stroke-width="${w+1.6}" opacity="0.4"/>`);
   frag.push(`<polyline points="${pts}" fill="none" stroke="${k?vcol(k):"#cfcfd6"}" stroke-width="${w}" opacity="${k?1:0.9}"/>`);
  });
  svg.insertAdjacentHTML("afterbegin",frag.join(""));
 };
 // region境界跨ぎ対応: 表示bboxに交差する全地域のwaysを読み込む
 const loadWays=(reg)=>BUILT[reg]?Promise.resolve(BUILT[reg])
  :fetch(`data/subsld_ways/${reg}.json?v=3`).then(r=>r.json())
   .then(j=>(BUILT[reg]=j.ways||[])).catch(()=>[]);
 const regsFor=()=>{
  if(!RB) return [s.r];
  const out=[];
  for(const [rg,b] of Object.entries(RB)){
   if(mla1>=b.lat_min&&mla0<=b.lat_max&&mlo1>=b.lon_min&&mlo0<=b.lon_max) out.push(rg);
  }
  return out.length?out:[s.r];
 };
 (RB?Promise.resolve(RB):fetch("data/built/regions_bbox.json").then(r=>r.json())
   .then(j=>(RB=j.regions)).catch(()=>null))
  .then(()=>Promise.all(regsFor().map(loadWays)))
  .then(all=>drawLines([].concat(...all)));
}

/* ---------- 開閉器(制御所ビュー) ---------- */
// 平常時状態 = データの normal_open。ユーザ操作は SWSTATE に差分として持つ。
function swKey(vi,i){return vi+"/"+i}
function swOpen(s,vi,i,sw){
 const st=SWSTATE[s.i]; const k=swKey(vi,i);
 return (st && k in st) ? st[k] : !!sw[1];
}
function swToggle(s,vi,i,sw){
 const k=swKey(vi,i); SWSTATE[s.i]=SWSTATE[s.i]||{};
 SWSTATE[s.i][k]=!swOpen(s,vi,i,sw);
 drawSLD(s); updateOpsNote(s);
}
// 母線区間の充電状態: その区間に「閉」の引出(feeder/trafo)が1つでも繋がれば充電。
// 母線連絡(coupler)が閉なら、繋がる区間どうしを同一系にまとめる(Union-Find)。
function energized(s,vl,vi){
 const n=Math.max(vl.b,1); const par=[...Array(n).keys()];
 const find=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x};
 const uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)par[a]=b};
 (vl.sw||[]).forEach((sw,i)=>{
  if(sw[0]===0 && !swOpen(s,vi,i,sw)){            // 閉じた母線連絡
   const secs=sw[2]||[]; for(let j=1;j<secs.length;j++) uni(secs[0],secs[j]);
  }});
 const live=new Set();
 (vl.sw||[]).forEach((sw,i)=>{
  if(sw[0]!==0 && !swOpen(s,vi,i,sw)){            // 閉じた引出=給電あり
   (sw[2]||[]).forEach(x=>live.add(find(x)));
  }});
 // 引出が1つも無い階級は、判定材料が無いので「不明」= 充電扱いにしない
 const hasFeeder=(vl.sw||[]).some(sw=>sw[0]!==0);
 return {live, find, hasFeeder, n};
}
// この変電所がループ(閉路)の中にあるか。座標一致で loops.json を引く
function loopInfo(s){
 if(!LOOPS) return null;
 // 構造DBの座標は敷地重心、loops.json は built のノード座標なので数十m ずれる。
 // 約200m 以内で最も近いものを採り、同一所の複数電圧ノードは
 // 「1つでもループ内なら ループ内」とみなす(運用上、迂回経路の有無が知りたい)
 let best=null, bd=Infinity, any=false, hit=false;
 for(const x of LOOPS.sites){
  const d=Math.abs(x.la-s.la)+Math.abs(x.lo-s.lo);
  if(d<0.002){ hit=true; if(!x.br) any=true; if(d<bd){bd=d;best=x;} }
 }
 return hit ? {...best, br: any?0:1} : null;
}
function updateOpsNote(s){
 const el=document.getElementById("opsNote"); if(!el) return;
 let opened=0, tot=0;
 s.vl.forEach((vl,vi)=>(vl.sw||[]).forEach((sw,i)=>{tot++; if(swOpen(s,vi,i,sw))opened++}));
 const diff=SWSTATE[s.i]?Object.keys(SWSTATE[s.i]).length:0;
 const li=loopInfo(s);
 const loopTxt = li ? (li.br
   ? ` ・ <span style="color:var(--mut)">ループ外（放射状：この所を切ると下位が停電）</span>`
   : ` ・ <span style="color:#4caf50">ループ内（別経路あり：開放しても迂回できる）</span>`)
   : "";
 el.innerHTML=`開閉器 ${tot} 台中 <b>開 ${opened}</b> / 閉 ${tot-opened}`+loopTxt+
  (diff?` ・ 平常時から <b style="color:var(--yel)">${diff}台</b> 操作` +
        ` <button id="swReset" style="margin-left:8px;background:#26262e;color:#f2f1ec;border:1px solid #444;border-radius:4px;padding:1px 8px;font-size:11px;cursor:pointer">平常時に戻す</button>`:"");
 const rb=document.getElementById("swReset");
 if(rb) rb.onclick=()=>{delete SWSTATE[s.i];drawSLD(s);updateOpsNote(s)};
}

/* ---------- 中央給電指令所ビュー ---------- */
function showDispatch(){
 const byReg={};
 DATA.forEach(s=>{
  const r=byReg[s.r]=byReg[s.r]||{sites:0,sw:0,coupler:0,kvmax:0,ops:0};
  // kv は数値配列。Math.max に文字列が混じると連結になるため Number 固定

  r.sites++;
  s.vl.forEach(vl=>{(vl.sw||[]).forEach(sw=>{r.sw++; if(sw[0]===0)r.coupler++})});
  r.kvmax=Math.max(r.kvmax, ...(s.kv.length?s.kv.map(Number):[0]));
  if(SWSTATE[s.i]) r.ops+=Object.keys(SWSTATE[s.i]).length;
 });
 const opsSites=Object.keys(SWSTATE).filter(k=>Object.keys(SWSTATE[k]).length);
 const rows=REGIONS.filter(r=>byReg[r]).map(r=>{
  const v=byReg[r];
  return `<tr><td>${r}</td><td style="text-align:right">${v.sites.toLocaleString()}</td>
   <td style="text-align:right">${v.sw.toLocaleString()}</td>
   <td style="text-align:right">${v.coupler.toLocaleString()}</td>
   <td style="text-align:right">${Number(v.kvmax)||0}kV</td>
   <td style="text-align:right;color:${v.ops?"var(--yel)":"var(--mut)"}">${v.ops||"—"}</td></tr>`;
 }).join("");
 const opsList=opsSites.length?opsSites.map(k=>{
  const s=DATA.find(x=>x.i===k); const n=Object.keys(SWSTATE[k]).length;
  return `<li><a href="#" data-site="${k}">${s?s._nl:k}</a> — ${n}台操作中（${s?s.r:"?"}）</li>`;
 }).join(""):`<li style="color:var(--mut)">平常時からの操作はありません</li>`;
 $("detail").innerHTML=`
  <div id="dhead"><span id="dname">中央給電指令所ビュー</span>
   <span id="dmeta">全国 ${DATA.length.toLocaleString()} 変電所の開閉点を俯瞰し、操作中の所を追跡する</span></div>
  <div class="pane" style="padding:14px 16px">
   <table style="width:100%;border-collapse:collapse;font-size:13px">
    <thead><tr style="color:var(--mut);font-size:11px;text-align:left">
     <th>地域</th><th style="text-align:right">変電所</th><th style="text-align:right">開閉器</th>
     <th style="text-align:right">母線連絡</th><th style="text-align:right">最高電圧</th>
     <th style="text-align:right">操作中</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>
  ${LOOPS?`<div class="pane" style="padding:14px 16px;margin-top:14px">
   <div style="font-size:13px;font-weight:bold;margin-bottom:6px">ループ（閉路）構造 — 系統の環状度合い</div>
   <table style="width:100%;border-collapse:collapse;font-size:13px">
    <thead><tr style="color:var(--mut);font-size:11px;text-align:left">
     <th>同期島</th><th style="text-align:right">節点</th><th style="text-align:right">枝</th>
     <th style="text-align:right">独立ループ</th><th style="text-align:right">ループ率</th>
     <th style="text-align:right">連結成分</th></tr></thead>
    <tbody>${Object.entries(LOOPS.islands).map(([k,v])=>
     `<tr><td>${k}</td><td style="text-align:right">${v.V.toLocaleString()}</td>
      <td style="text-align:right">${v.E.toLocaleString()}</td>
      <td style="text-align:right"><b>${v.circuit_rank.toLocaleString()}</b></td>
      <td style="text-align:right">${(v.loop_ratio*100).toFixed(1)}%</td>
      <td style="text-align:right;color:var(--mut)">${v.components}</td></tr>`).join("")}</tbody></table>
   <div style="color:var(--mut);font-size:11px;margin-top:8px">
    独立ループ数 = 枝 − 節点 + 連結成分（circuit rank）。ループが多いほど迂回経路があり、
    1本の開放で停電しにくい。ループ外（周囲がすべて橋）の変電所は
    <b>${LOOPS.sites.filter(x=>x.br).length.toLocaleString()}</b> / ${LOOPS.n_sites.toLocaleString()} 所。
    ただし OSM 欠測で切れて見える箇所も橋として現れるため、放射状に見えても実系統では
    ループしている場合がある（issue #49）。</div>
  </div>`:""}
  <div class="pane" style="padding:14px 16px;margin-top:14px">
   <div style="font-size:13px;font-weight:bold;margin-bottom:6px">操作中の変電所</div>
   <ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.9">${opsList}</ul>
  </div>
  <div id="legend">開閉器はベイの位置づけから導いたもので（<code>inferred-bay</code>）、
   遮断器そのものを観測したわけではありません。平常時の開閉状態も運用上の既定です。
   制御所ビューで操作した内容はこの画面に集約されます（ブラウザ内のみ・保存されません）。</div>`;
 document.querySelectorAll("#detail a[data-site]").forEach(a=>{
  a.onclick=e=>{e.preventDefault();const s=DATA.find(x=>x.i===a.dataset.site);
   if(s){ROLE="control";document.querySelectorAll("#roles .role").forEach(x=>
    x.classList.toggle("on",x.dataset.role==="control"));select(s);}};});
}

/* ---------- SLDPane: SVG 単線結線図 ---------- */
function drawSLD(s){
 const el=$("sld");const W=el.clientWidth||700;
 const vls=s.vl;const nvl=Math.max(vls.length,1);
 const maxg=Math.max(1,...vls.map(v=>v.g.length));
 const ROW=170,PAD=46;
 const H=nvl*ROW+40;
 const bw=Math.max(W-260,320);      // 母線長
 const trx0=128+bw+30;              // 変圧器ゾーン
 let out=[];
 const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
 vls.forEach((v,vi)=>{
  const y=PAD+vi*ROW+70;
  const col=vcol(v.k);
  const nsec=Math.max(v.b,1);
  const inferred=(v.b===0);
  // 母線ラベル
  out.push(`<text x="118" y="${y+5}" text-anchor="end" font-size="17" font-weight="bold" fill="${col}">${v.k?v.k+"kV":"無印"}</text>`);
  const tot=v.g.reduce((a,g)=>a+g[1],0);
  out.push(`<text x="118" y="${y+22}" text-anchor="end" font-size="9.5" fill="${col}">母線×${inferred?"推定":nsec}・${v.g.length}線・${tot}回線${v.thru&&s.tr.length?"・スルー":""}</text>`);
  if(v.thru&&!s.tr.length&&vi===0)
   out.push(`<text x="118" y="${y+34}" text-anchor="end" font-size="9" fill="#999">スルー/開閉(変圧器なし)</text>`);
  // 母線セクション(制御所ビューでは充電状態で明暗を付ける)
  const E=(ROLE==="control")?energized(s,v,vi):null;
  for(let i=0;i<nsec;i++){
   const xa=128+bw*i/nsec+(i?4:0),xb=128+bw*(i+1)/nsec;
   let op=1, dash=inferred?'stroke-dasharray="10 6"':'';
   if(E && E.hasFeeder && !E.live.has(E.find(i))) op=0.22;   // 無充電=薄く
   out.push(`<line x1="${xa}" y1="${y}" x2="${xb}" y2="${y}" stroke="${col}" stroke-width="${inferred?3.5:5}" ${dash} opacity="${inferred?op*0.75:op}"/>`);
   if(E && E.hasFeeder && !E.live.has(E.find(i)))
    out.push(`<text x="${(xa+xb)/2}" y="${y-9}" text-anchor="middle" font-size="8" fill="#999">無充電</text>`);
  }
  // 開閉器(クリックで開閉)。□=閉(導通) / 斜線□=開
  (v.sw||[]).forEach((sw,i)=>{
   const isOpen=swOpen(s,vi,i,sw);
   const kindLbl=["母線連絡","回線引出","変圧器引出"][sw[0]]||"開閉器";
   const xs=(sw[2]&&sw[2].length)
     ? sw[2].map(k=>128+bw*(k+0.5)/nsec)
     : [128+bw*(i+0.5)/Math.max((v.sw||[]).length,1)];
   const x=xs.reduce((a,b)=>a+b,0)/xs.length;
   const yy=y+ (sw[0]===0 ? 26 : -26);
   if(sw[0]===0 && xs.length>1){   // 母線連絡は区間どうしを結ぶ
    out.push(`<line x1="${Math.min(...xs)}" y1="${yy}" x2="${Math.max(...xs)}" y2="${yy}" stroke="${col}" stroke-width="1.2" opacity="${isOpen?0.35:1}"/>`);
    xs.forEach(xx=>out.push(`<line x1="${xx}" y1="${y}" x2="${xx}" y2="${yy}" stroke="${col}" stroke-width="1.2" opacity="${isOpen?0.35:1}"/>`));
   } else {
    out.push(`<line x1="${x}" y1="${y}" x2="${x}" y2="${yy}" stroke="${col}" stroke-width="1.2" opacity="${isOpen?0.35:1}"/>`);
   }
   out.push(`<g class="sw" data-vi="${vi}" data-i="${i}" style="cursor:pointer">`+
     `<rect x="${x-5}" y="${yy-5}" width="10" height="10" fill="${isOpen?"#fff":col}" stroke="${col}" stroke-width="1.6"/>`+
     (isOpen?`<line x1="${x-5}" y1="${yy+5}" x2="${x+5}" y2="${yy-5}" stroke="${col}" stroke-width="1.4"/>`:``)+
     `<title>${kindLbl} — ${isOpen?"開":"閉"}（クリックで切替）</title></g>`);
  });
  if(inferred) out.push(`<text x="${128+bw/2}" y="${y+16}" text-anchor="middle" font-size="8.5" fill="#999">推定母線（OSMにbusbar way無し — issue #49）</text>`);
  if(s.tr.length)
   out.push(`<line x1="${128+bw}" y1="${y}" x2="${trx0+s.tr.length*34}" y2="${y}" stroke="${col}" stroke-width="1" opacity="0.5"/>`);
  // 線スタブ(セクションごとにスロット)
  const bySec={};
  v.g.forEach(g=>{(bySec[g[4]>=0&&g[4]<nsec?g[4]:-1]=bySec[g[4]>=0&&g[4]<nsec?g[4]:-1]||[]).push(g)});
  Object.entries(bySec).forEach(([sec,gs])=>{
   const si=+sec;
   const xa=si>=0?128+bw*si/nsec:128, xb=si>=0?128+bw*(si+1)/nsec:128+bw;
   gs.forEach((g,gi)=>{
    const x=xa+(xb-xa)*(gi+0.5)/gs.length;
    const [nm,par,dir,lead]=g;
    const up=dir!==1, gray=dir===2;
    const c=gray?"#999":col;
    const stub=34, sgn=up?-1:1, tier=(gi%2)*16;
    for(let p=0;p<Math.min(par,4);p++){
     const dx=(p-(Math.min(par,4)-1)/2)*3.2;
     out.push(`<line x1="${x+dx}" y1="${y}" x2="${x+dx}" y2="${y+sgn*stub}" stroke="${c}" stroke-width="1.6" ${lead?'stroke-dasharray="4 3"':''}/>`)}
    if(!gray) out.push(`<path d="M ${x-3.4} ${y+sgn*stub*0.5-3} l 3.4 5 l 3.4 -5 z" fill="${c}" transform="rotate(${up?0:180} ${x} ${y+sgn*stub*0.5})"/>`);
    if(tier) out.push(`<line x1="${x}" y1="${y+sgn*stub}" x2="${x}" y2="${y+sgn*(stub+tier)}" stroke="${c}" stroke-width="0.7" opacity="0.5"/>`);
    const ly=y+sgn*(stub+tier+6);
    out.push(`<text x="${x}" y="${ly}" font-size="8.6" fill="${gray?"#888":"#222"}" transform="rotate(-52 ${x} ${ly})" text-anchor="${up?"start":"end"}">${esc(nm)}${par>1?` ・${par}回線`:""}</text>`);
   })});
 });
 // 変圧器
 s.tr.forEach((t,ti)=>{
  const yi=vls.findIndex(v=>v.k===t[0]),yo=vls.findIndex(v=>v.k===t[1]);
  if(yi<0||yo<0)return;
  const ya=PAD+yi*ROW+70, yb=PAD+yo*ROW+70, x=trx0+ti*34;
  const ym=(ya+yb)/2;
  out.push(`<line x1="${x}" y1="${ya}" x2="${x}" y2="${yb}" stroke="#444" stroke-width="1.6"/>`);
  out.push(`<circle cx="${x}" cy="${ya}" r="2.4" fill="#444"/><circle cx="${x}" cy="${yb}" r="2.4" fill="#444"/>`);
  out.push(`<circle cx="${x}" cy="${ym-6}" r="9" fill="none" stroke="#444" stroke-width="1.6"/>`);
  out.push(`<circle cx="${x}" cy="${ym+6}" r="9" fill="none" stroke="#444" stroke-width="1.6"/>`);
  out.push(`<text x="${x+13}" y="${ym+3}" font-size="9" fill="#444">tr${ti+1}${t[2]>1?`×${t[2]}`:""}</text>`);
 });
 el.innerHTML=`<svg width="100%" viewBox="0 0 ${Math.max(W,trx0+s.tr.length*34+30)} ${H}" xmlns="http://www.w3.org/2000/svg">${out.join("")}</svg>`;
 if(ROLE==="control") el.querySelectorAll("g.sw").forEach(g=>{
  g.onclick=()=>{const vi=+g.dataset.vi,i=+g.dataset.i;
   swToggle(s,vi,i,s.vl[vi].sw[i]);};});
}
window.addEventListener("resize",()=>{if(SEL){drawGeo(SEL);drawSLD(SEL)}});
</script>
</body>
