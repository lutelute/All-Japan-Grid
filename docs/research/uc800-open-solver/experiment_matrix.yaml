# Planning specification only. No current runner consumes this file.
schema_version: 1
status: proposed_not_executed
created_on: '2026-10-23'
project: uc800-open-solver

problem:
  base_model: UC800-Z-v1
  temporal_resolution_hours: 1
  uncertainty: deterministic_perfect_foresight
  commitment_units_target: 800
  commitment_units_verified: false
  storage_count: separate_from_commitment_units
  network: zonal_transport
  maintenance: exogenous
  annual_horizon: derive_from_timestamp_calendar
  timezone: Asia/Tokyo
  initial_state: explicit_in_manifest
  terminal_policy: explicit_in_manifest
  fuel_water_emission_budgets: separate_extension_cases
  ybus_gate: required_before_consuming_grid_model

correctness_gates:
  - canonical_input_and_objective_hashes
  - unit_vs_plant_inventory
  - explicit_effective_solver_without_silent_fallback
  - native_primal_and_dual_bounds
  - preserve_time_limited_incumbent
  - independent_full_horizon_feasibility_check
  - boundary_u_p_history_startup_soc_and_resource_continuity
  - objective_recomputed_without_lookahead_double_counting
  - tiny_monolithic_optimum_bracketed_by_decomposed_bounds
  - multiplier_version_consistency_for_bound_aggregation

cases:
  correctness:
    units: [4, 10]
    horizon_hours: [24, 48, 72]
  scaling:
    units: [100, 400, 800]
    horizon_hours: [24, 48, 168]
  monthly:
    units: [800]
    horizon_hours: [720]
  annual:
    units: [800]
    horizon: full_calendar
  external:
    source_candidate: UnitCommitment.jl
    pinned_version: null
    instance_ids: []
    semantics_check_required: true

case_selection:
  provenance_classes: [observed_or_reconstructed, synthetic]
  stressors:
    - seasonal_demand
    - renewable_availability
    - evening_net_load_ramp
    - multi_day_low_renewables
    - interconnection_congestion
    - planned_outage_concentration
    - long_duration_storage_and_resource_limits
  split_unit: nonoverlapping_weeks
  seed_count_screening: 3
  seed_count_finalists: 5

methods:
  - {id: B0, formulation: audited_existing, backend: highs}
  - {id: B1, formulation: same_mps_as_B0, backend: scip_serial}
  - {id: B2, formulation: equivalent_strengthened_uc, backend: scip_serial}
  - {id: P1, formulation: B2, backend: scip_concurrent}
  - {id: P2, formulation: B2, backend: fiberscip}
  - {id: P3, formulation: B2, backend: parascip}
  - {id: H1, base: B2, heuristic: fixed_or_random_neighborhood}
  - {id: H2, base: B2, heuristic: event_spanning_neighborhood}
  - {id: Y0, primal: state_continuous_rolling, lookahead_hours: [48, 72, 168]}
  - {id: Y1, base: Y0, primal: boundary_repair, lower_bound: weekly_lagrangian}
  - {id: Y2, base: Y1, extension: adaptive_blocks_and_compute_allocation}
  - {id: Y3, condition: lower_bound_stagnation, alternative: column_generation}

provisional_targets:
  status: unmeasured_research_targets
  daily:
    horizon_hours: [24, 48]
    relative_gap: 0.001
    time_budget_seconds_per_case: 900
  weekly:
    horizon_hours: [168]
    relative_gap: 0.005
    time_budget_seconds_per_case: 7200
  annual_feasible:
    full_horizon_validation: pass
    time_budget_seconds: 86400
  annual_bounded:
    first_gate: finite_valid_lower_bound
    relative_gap_goal: 0.01
    total_time_budget_seconds: 259200

hardware:
  resources_confirmed: false
  jobs_submitted: false
  shared_node_physical_cores_candidate: [32, 64]
  distributed_total_cores_candidate: [128, 256]
  scaling_workers_candidate: [1, 2, 4, 8, 16, 32, 64]
  ram_gib_per_node: null
  mpi_version: null
  queue_limits: null
  enforce_memory_budget: true
  prevent_nested_oversubscription: true

report:
  common_relative_gap: '(UB-LB)/max(1 currency_unit, abs(UB))'
  missing_bound_gap: null
  bound_scope_required: true
  retain_native_solver_gap: true
  retain_failed_and_timed_out_cases: true
  compare_equal_wall_time_and_equal_core_hours: true
  metrics:
    - full_pipeline_wall_seconds
    - model_build_seconds
    - presolve_seconds
    - root_lp_seconds
    - search_seconds
    - validation_seconds
    - first_feasible_seconds
    - primal_bound_trace
    - dual_bound_trace
    - primal_dual_integrals_with_explicit_convention
    - peak_rss_bytes_per_worker_and_node
    - measured_cpu_seconds
    - allocated_core_hours
    - termination_reason
    - full_horizon_constraint_residuals
