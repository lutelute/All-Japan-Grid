# 原理編：上界と下界は、どうやって出てくるのか（2026-10-25）
# 3 台の例の数字は、各節点で LP を実際に解いて確かめた値（HiGHS）。800 台の数字は IMPLEMENTATION_STATUS.md の実測

title: 上界と下界は、どこから来るのか

voice: {speaker: 3, name: ずんだもん, speed: 1.08}

read:
  下界: かかい
  上界: じょうかい
  MW: メガワット
  HiGHS: ハイエス
  LP: エルピー

credits:
  - 音声：VOICEVOX:ずんだもん
  - 3台の例の数字：各節点でLPを解いて確認（HiGHS）

slides:
  - kind: title
    title: 上界と下界は、どこから来るのか
    sub: 起動停止計画の解き方を、3台の例で原理から
    questions:
      - 全部の組み合わせは、なぜ調べられない？
      - 下界は、どこから出てくる？
      - 上界は？
      - 木を切ると、なぜ最適と言える？
    say:
      - 起動停止計画を解くと出てくる、上界と下界という二つの数字が、どこから来るのかを説明します。
      - 3台の小さな例で、実際に数字を出しながら見ていきます。

  - kind: points
    role: 説明
    title: 全部の組み合わせは、調べられない
    points:
      - 1台・1時間ごとに「動かす（1）か、止める（0）か」
      - 800台×48時間＝38,400個の二択 → 2の38,400乗通り（11,560桁の数）
      - → 全部を試さずに「最適だ」と言える仕組みが要る
    say:
      - 発電機は1時間ごとに、動かすか止めるかの二択です。
      - 800台を48時間なら二択が3万8400個あり、組み合わせは1万1千桁を超える数になります。
      - 全部は試せないので、試さずに最適だと言える仕組みが必要です。

  - kind: points
    role: 説明
    title: 3台の小さな例
    points:
      - 需要250MWを、A・B・Cの3台でまかなう（1時間）
      - A：200MW・無負荷1000・単価10 ／ B：150MW・300・20 ／ C：100MW・200・30
      - 最低出力は定格の半分。0と1の組み合わせは8通り
      - → 全部試すと、AとBを動かす4550が最安
    say:
      - 説明のために、3台で250MWをまかなう小さな例を作りました。
      - 組み合わせは8通りなので全部試せて、AとBを動かす4550が最安です。
      - この答えを、全部は試さずに見つける方法を見ていきます。

  - kind: clip
    title: 緩めると、下界が出る
    video: clips/relax.mp4
    say:
      - まず、動かすか止めるかの二択を、0から1の間の好きな値に緩めます。
      - するとBを3分の1だけ動かすような計画が許され、計算はすぐ終わって、費用は4100になります。
      - 選べる範囲を広げた問題の最安値なので、本当の最安値は、これより安くはなりません。これが下界です。

  - kind: clip
    title: 成り立つ計画を見つけると、上界が出る
    video: clips/upper.mp4
    say:
      - 次に、0と1だけで成り立つ計画をひとつ見つけます。たとえばAとCを動かすと、費用は4700です。
      - 本当の最安値はこれより高くならないので、これが上界で、最適値は4100から4700の間にあります。

  - kind: clip
    title: 枝分かれして、切っていく
    video: clips/tree.mp4
    say:
      - 半端になったBを、止める場合と動かす場合に分けて、それぞれをまた緩めて解きます。
      - Bを止めると4600、動かすと4425で、選べる範囲を狭めた分だけ、どちらも元の4100より上がります。
      - 4425の側で半端なAを分けると、Aを動かす側は0と1がそろった4550の計画になり、上界が4550に下がります。
      - 残りの6500と4600は、どちらも4550より高いので、その先に良い計画はなく、切ってしまえます。
      - 残った下界も4550になって上界と一致したので、4550が最適だと証明できました。

  - kind: points
    role: 注意
    title: 800台では、木の根で時間が尽きた
    points:
      - 48時間・900秒：HiGHSの探索は根から一度も枝分かれしなかった
      - 下界は、根で緩めた問題（とカット）の値で止まっている
      - → 幅1.1%は、根の緩め方がどれだけゆるいか、そのもの
    say:
      - 800台・48時間では、900秒たっても、木の根から一度も枝分かれしませんでした。
      - つまり下界は、根で緩めた問題の値で止まっていて、1.1%の幅は、その緩め方のゆるさそのものです。

  - kind: clip
    title: 強い書き方は、緩めた範囲を小さくする
    video: clips/strong.mp4
    say:
      - そこで、0と1の答えは一つも消さずに、緩めた範囲だけを小さくする式を足します。
      - 範囲が小さくなると、緩めた問題の最安値が上がり、下界が上がります。
      - 800台では、起動の数え方を直す式で、48時間の幅が1.1%から0.57%になりました。

  - kind: answer
    role: 安全
    title: まとめ
    lines:
      - "① 緩めて解いた値が下界（範囲を広げたので本物以下）"
      - "② 成り立つ計画の費用が上界（本物以上）"
      - "③ 枝分かれで下界を上げ、上界より高い枝は切る"
      - "④ 届かなければ、強い書き方で根の下界を上げる"
    say:
      - 下界は緩めた問題から、上界は成り立つ計画から出てきます。
      - 枝分かれで下界を上げながら、上界より高い枝を切り、二つがそろえば最適の証明です。
      - 枝分かれが届かない大きな問題では、書き方を強くして、根の下界を上げることが効きます。

end: {text: 下界は緩めて、上界は見つけて、木で挟む。, seconds: 4}
