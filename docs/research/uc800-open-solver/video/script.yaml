# 800 台の起動停止計画（UC）を、本当に解けているかの話（2026-10-25）
# 数字は All-Japan-Grid の research/uc800-open-solver ブランチの実測（docs/research/uc800-open-solver/IMPLEMENTATION_STATUS.md）
# 問題は合成した 800 台（実在の発電機ではない）。費用は合成ケースの単位

title: 800台は、本当に解けたのか

voice: {speaker: 3, name: ずんだもん, speed: 1.08}

read:
  下界: かかい
  上界: じょうかい
  HiGHS: ハイエス
  SCIP: スキップ
  CBC: シービーシー
  GPU: ジーピーユー
  CPU: シーピーユー
  LP: エルピー
  gap: ギャップ

credits:
  - 音声：VOICEVOX:ずんだもん
  - 数字：合成した800台での実測（pws-gpu3060・共同研究先のGB10）

slides:
  - kind: title
    title: 800台は、本当に解けたのか
    sub: 発電機の起動停止計画を、合成した800台で測った
    questions:
      - 「100台が限界」はどこから来た？
      - 800台は、どこまで解けた？
      - どこで詰まっていた？
      - どう破る？
    say:
      - 発電機の起動と停止を決める計画を、800台の規模で本当に解けているのか、確かめました。
      - 限界の話、どこまで解けたか、詰まりの場所、その破り方の順に見ていきます。

  - kind: points
    role: 注意
    title: 「100台が限界」はどこから来たか
    points:
      - 論文の「100機以下が実用限界」は、文献の目安
      - 5〜6月、全国の600〜800機を10〜40秒で解いていた
      - ただし発電所単位・24時間の易しい形。6月の時点では実はCBCで解かれ、gapは0と決め打ち
      - → 難しい形で、上界と下界を測り直す
    say:
      - 論文にある「100機以下が実用限界」という言葉は、文献の目安で、このプログラムで測った値ではありません。
      - 5月から6月には、全国の600機から800機ほどを数十秒で解いていましたが、発電所単位で24時間の、易しい形でした。
      - しかも6月の時点では、実はCBCという別のソルバーで解かれていて、最適との差は確かめずに0と記録されていました。

  - kind: points
    role: 説明
    title: 今回の問題と、「解けた」の物差し
    points:
      - 合成した800台＋蓄電池4台、4地域（実在の発電機ではない）
      - 全機に起動停止・最小運転時間・ランプ・3種類の起動費
      - 物差し：解がある → 独立に検証 → 最適値からの距離（gap）
    say:
      - 今回は、全部の機械に起動と停止の決まりを持たせた、合成の800台を使いました。
      - 解けたかどうかは、解があるか、独立に検証したか、最適値からどれだけ離れうるかの、3段で判定します。

  - kind: points
    role: 説明
    title: 60秒の「解けない」は、予算の問題だった
    points:
      - 60秒：48時間は、どのソルバーも解なし
      - 900秒：HiGHSでもSCIPでも、検証済みの解
      - 1週間（168時間）は、30分でも下界が0のまま
      - → 詰まりは「解を探す」より「下界を上げる」側
    say:
      - 最初の試し打ちの60秒では、48時間の問題に解が見つかりませんでした。
      - 計画どおり900秒かけると、HiGHSでもSCIPでも、検証済みの解が出ました。
      - 一方、1週間の問題は30分かけても下界が出ず、詰まりは下界の側にあると分かりました。

  - kind: clip
    title: 48時間：最適値を上と下から挟む
    video: clips/bounds.mp4
    say:
      - 見つけた計画の費用が上界で、本当の最適値は、これより高くはなりません。
      - 下界は、どんな計画でもこれより安くはできない、という保証です。
      - 48時間では、最適値が736億から744億の間にあり、その幅は1.1%でした。
      - 24時間ずつ区切って解くローリングの解も、最適値から多くても1.2%です。

  - kind: points
    role: 注意
    title: 途中で見つけた不具合
    points:
      - HiGHSに渡した初期解が、形の誤りで毎回捨てられていた
      - スレッド数を変えると、黙って解かずに終わっていた
      - → 直してローリングの解を渡すと、SCIPのgapは13% → 1.4%
    say:
      - 途中で、HiGHSに渡していた初期解が、形の誤りで毎回捨てられていたことが分かりました。
      - 直したうえでローリングの解を初期解として渡すと、SCIPのギャップは13%から1.4%に縮みました。

  - kind: clip
    title: 下界は、どこから漏れていたか
    video: clips/leak.mp4
    say:
      - 下界と最良の解の差、約10億を費用ごとに分けると、ほぼ全部が起動の費用でした。
      - 下界の計算では運転を半分のような値で扱えるため、止めていない機械が、安い温起動をしたことにできてしまいます。
      - そこで、直前に止めた記録があるときだけ温起動と数え直すと、この抜け道がふさがります。

  - kind: points
    role: 安全
    title: 抜け道をふさぐと
    points:
      - 48時間の下界：734.50億 → 738.50億
      - 最良の解との差：1.34% → 0.80%
      - ランプを強めても、下界はほぼ動かない（対照）
      - 足した式で最適値が変わらないことは、小さい問題で確認
    say:
      - 停止の記録で数える式を足すと、48時間の下界は734.5億から738.5億に上がり、差は1.34%から0.8%に縮みました。
      - この下界は、HiGHSが900秒かけて出した下界よりも上です。比べのためにランプを強めた場合は、ほとんど動きませんでした。
      - 足した式で最適値が変わらないことは、小さな問題で確かめています。

  - kind: points
    role: 安全
    title: 強めた書き方で、900秒解くと
    points:
      - HiGHS：gap 1.11% → 0.57%（ほぼ半分）
      - 下界 736.25 → 739.65億、解も 744.44 → 743.85億
      - SCIPは式が増えた分、最初の計算が終わらず悪化
      - → 最適値は 739.65〜743.85億の間、幅0.57%
    say:
      - 強めた書き方のまま900秒解くと、HiGHSのギャップは1.11%から0.57%へ、ほぼ半分になりました。
      - 下界が上がっただけでなく、見つかる解も744.4億から743.9億に良くなりました。
      - 一方SCIPは、式が増えた分だけ最初の計算が900秒で終わらず、かえって悪くなりました。

  - kind: points
    role: 説明
    title: GPUで、下界を速く出す
    points:
      - 48時間の下界の計算：CPU 107秒 → GPU 18秒
      - 1週間：CPUは30分で出ず → GPUで94秒
      - → 1週間のローリングの解も、最適値から約1.5%以内（近似の値）
    say:
      - 下界の計算は、共同研究先のGPUで内点法を使うと、48時間の問題で107秒から18秒になりました。
      - 1週間の問題も94秒で下界が出て、ローリングの解が最適値から約1.5%以内だと分かりました。

  - kind: answer
    role: 安全
    title: まとめ
    lines:
      - "① 100台の壁は文献の目安。5月の800機は易しい形"
      - "② 難しい800台×48時間は、最適値から1.1%まで"
      - "③ 詰まりは下界。漏れのほとんどは起動費の数え方"
      - "④ 起動の数え直しで、48時間の幅は1.1% → 0.57%"
    say:
      - 100台の壁は文献の目安で、5月の800機は易しい形でした。
      - 難しい800台では、詰まりは下界にあり、その漏れのほとんどは起動費の数え方でした。
      - 起動の数え方を直すと、48時間の幅は1.1%から0.57%に縮みました。次は、GPUも使って1週間から1年へ進みます。

end: {text: 解けたかどうかは、上界と下界で言う。, seconds: 4}
