<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCCTO 潮流実績 — AGJ</title>
<meta name="description" content="OCCTO が公表する地内基幹送電線の潮流実績(30 分値)を、運用容量に対する割合で色づけした地図。毎時更新">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* 配置: 上に時刻の帯(時刻・つまみ・再生)、下は地図(広く)と右の欄(この時刻・負荷の高い線路・選んだ線路・連系線)。狭いと縦に積む。
   データは 2 つ: data/flow_map/occto_lines.json(線の形、照合を作り直したときだけ変わる)と
   data/flow_map/occto_today.json(前日 0 時から今まで、毎時の処理 scripts/export_occto_today.py が書く)。10 分ごとに読み直す */
:root{
  --bg:#eef1f4; --panel:#f8fafb; --ink:#17212b; --muted:#5b6876; --rule:#d3dae1;
  --land:#dfe5ea; --coast:#b9c4ce; --accent:#1f6feb; --warn:#b42318;
  --l0:#2a9d8f; --l1:#7fb069; --l2:#e9c46a; --l3:#f08a4b; --l4:#d62828; --nocap:#7a8a99;
  --sel:#111827;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --panel:#141c25; --ink:#e6edf3; --muted:#93a1b0; --rule:#26323f;
  --land:#1b2530; --coast:#2f3d4c; --accent:#58a6ff; --warn:#ff7b72;
  --l0:#2ec4b6; --l1:#9ad46b; --l2:#f4d35e; --l3:#ff9f5a; --l4:#ff4d4d; --nocap:#6b7c8d; --sel:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --panel:#141c25; --ink:#e6edf3; --muted:#93a1b0; --rule:#26323f;
  --land:#1b2530; --coast:#2f3d4c; --accent:#58a6ff; --warn:#ff7b72;
  --l0:#2ec4b6; --l1:#9ad46b; --l2:#f4d35e; --l3:#ff9f5a; --l4:#ff4d4d; --nocap:#6b7c8d; --sel:#ffffff; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55}
.wrap{display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box;
  padding-block:12px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{font-size:12px;font-weight:700}
.back a{color:var(--accent);text-decoration:none}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.status{font-size:12.5px;margin:2px 0 0;color:var(--muted)}
.status b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.status .stale{color:var(--warn);font-weight:700}
.timebar{display:flex;align-items:center;gap:10px;flex:1 1 360px;min-width:0}
.clock{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;white-space:nowrap}
#t{flex:1;min-width:120px;accent-color:var(--accent)}
button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:5px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,li:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;flex:1;min-height:560px}
.mapbox{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden;min-height:480px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.legend{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:12px;display:grid;gap:4px;max-width:calc(100% - 48px)}
.ramp{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.ramp i{display:block;width:26px;height:6px;border-radius:2px}
.ramp span{font-family:var(--f-num);font-size:11px;color:var(--muted);margin-left:4px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;font-size:12.5px;max-width:280px;box-shadow:0 4px 14px rgb(0 0 0 / .18)}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:16px;pointer-events:none}
.msg[hidden]{display:none}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;min-width:0}
.card h2{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats b{display:block;font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:11.5px}
ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
li.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer}
li.row:hover,li.row.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm em{font-style:normal;color:var(--muted);font-size:11.5px;margin-left:4px}
.pct{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px;padding:0 6px;border-radius:4px;color:#111}
.ic{display:grid;gap:7px}
.icr{display:grid;gap:2px}
.icr .top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.icr .top span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{position:relative;height:8px;background:var(--land);border-radius:4px}
.bar .z{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.bar .f{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.detail{font-size:12.5px;display:grid;gap:4px}
.detail .k{color:var(--muted)}
.detail svg{width:100%;height:70px;display:block}
footer a{color:var(--accent)}
footer{color:var(--muted);font-size:12px;line-height:1.6;max-width:100ch}
footer p{margin:0 0 4px}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}.mapbox{min-height:420px;height:62vh}}
</style>
</head>
<body>
<div class="wrap">
<div class="back"><a href="./index.html">&#8592; ダッシュボード</a></div>
<header>
  <div>
    <h1>OCCTO 潮流実績</h1>
    <p class="sub" id="sub">地内基幹送電線の潮流実績(30 分値)を、運用容量に対する割合で色づけ。前日 0 時から今まで、毎時更新</p>
    <p class="status" id="status">読み込み中…</p>
  </div>
  <div class="timebar">
    <button id="play" type="button">▶ 再生</button>
    <input id="t" type="range" min="0" max="0" step="1" aria-label="時刻">
    <span class="clock" id="clock">—</span>
  </div>
</header>
<div class="main">
  <div class="mapbox" id="mapbox">
    <canvas id="map" aria-label="地内基幹送電線の潮流の地図"></canvas>
    <div class="msg" id="msg">読み込み中…</div>
    <div class="legend" aria-hidden="true">
      <div>運用容量に対する潮流</div>
      <div class="ramp" id="ramp"></div>
      <div class="ramp"><i style="background:var(--nocap)"></i><span>容量なし・値なし</span></div>
      <div style="color:var(--muted)">太さ = 潮流の大きさ。ドラッグで移動、ホイールかピンチで拡大</div>
    </div>
    <div class="tip" id="tip" hidden></div>
  </div>
  <div class="side">
    <div class="card">
      <h2>この時刻</h2>
      <div class="stats">
        <div><b id="s-n">—</b><small>値のある線路</small></div>
        <div><b id="s-80">—</b><small>80% 以上</small></div>
        <div><b id="s-max">—</b><small>いちばん高い</small></div>
      </div>
    </div>
    <div class="card">
      <h2>負荷の高い線路</h2>
      <ol id="top"></ol>
    </div>
    <div class="card">
      <h2>選んだ線路</h2>
      <div class="detail" id="detail"><span class="k">地図の線か、上の一覧を押すと出ます</span></div>
    </div>
    <div class="card">
      <h2>連系線(5 分値のうち同じ時刻の値)</h2>
      <div class="ic" id="ic"></div>
    </div>
  </div>
</div>
<footer id="foot"></footer>
</div>
<script>
(() => {
const BASE = 'data/flow_map/';
const REFRESH_MS = 10 * 60 * 1000;     // 当日分を読み直す間隔(データは毎時)
const STALE_MS = 2.5 * 3600 * 1000;    // 最後の取得からこれより経ったら「止まっている」と出す
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STOPS = [0, .3, .6, .85, 1];
let LN = null, TD = null, T = [], L = [], ti = 0, sel = -1, hover = -1, playing = null, lastLoad = 0;

// 投影: 経度を cos(36°) で縮めた正距円筒
const KX = Math.cos(36 * Math.PI / 180);
const P = ([lon, lat]) => [lon * KX, -lat];
let land = [], minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
const cv = $('map'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, sc = 1, sc0 = 1, ox = 0, oy = 0;
function fit() {
  const r = cv.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  if (!land.length) return;
  sc = sc0 = Math.min(W / (maxx - minx), H / (maxy - miny)) * 0.94;
  ox = (W - (maxx - minx) * sc) / 2 - minx * sc; oy = (H - (maxy - miny) * sc) / 2 - miny * sc;
}
const sx = x => x * sc + ox, sy = y => y * sc + oy;

async function getJSON(name) {
  const r = await fetch(BASE + name, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`${name}: ${r.status}`);
  return r.json();
}

// 線路の一覧(形)に当日の値をのせる。当日の表にだけある線路は形なしで足す(一覧には出る)
function build() {
  const byId = new Map();
  L = LN.lines.map(x => ({ ...x, pp: x.p.map(path => path.map(P)), v: [] }));
  L.forEach(l => byId.set(l.id, l));
  for (const [id, e] of Object.entries(TD.lines)) {
    let l = byId.get(id);
    if (!l) { const [a, n, d] = id.split('|'); l = { id, a, n, d, kv: e.kv, c: null, p: [], pp: [] }; L.push(l); byId.set(id, l); }
    l.v = e.v;
  }
  T = TD.times;
}

// 運用容量: 潮流の向きに合う公表値があればそれ、無ければ反対向きの値、それも無ければ最大
const capDays = () => Object.keys(TD.cap).sort();
function capOf(l, i) {
  const day = (T[i] || '').slice(0, 10), days = capDays();
  const c = (TD.cap[day] || {})[l.id] || (days.length ? (TD.cap[days[days.length - 1]] || {})[l.id] : null);
  if (!c) return null;
  const v = l.v[i], want = v != null && v < 0 ? 1 : 0;
  if (c[want] != null) return { cap: c[want], f: c[want + 3], note: '' };
  if (c[1 - want] != null) return { cap: c[1 - want], f: c[4 - want], note: '反対向きの値' };
  return { cap: c[2], f: c[5], note: '' };
}
function load(l, i) {
  const v = l.v[i], c = capOf(l, i);
  if (v == null || !c || !c.cap) return null;
  return Math.abs(v) / c.cap;
}
function col(r) {
  if (r == null) return css('--nocap');
  const names = ['--l0', '--l1', '--l2', '--l3', '--l4'];
  let k = 0; while (k < STOPS.length - 1 && r >= STOPS[k + 1]) k++;
  return css(names[k]);
}
function width(v) { return v == null ? 1 : Math.max(1, Math.min(7, Math.sqrt(Math.abs(v)) / 7)); }

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = css('--panel'); ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = css('--land'); ctx.strokeStyle = css('--coast'); ctx.lineWidth = 0.6;
  land.forEach(r => { ctx.beginPath(); r.forEach(([x, y], j) => j ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y))); ctx.closePath(); ctx.fill(); ctx.stroke(); });
  const order = L.map((l, i) => i).filter(i => L[i].pp.length).sort((a, b) => (load(L[a], ti) ?? -1) - (load(L[b], ti) ?? -1));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const i of order) {
    const l = L[i];
    if (i === sel || i === hover) { ctx.strokeStyle = css('--sel'); ctx.lineWidth = width(l.v[ti]) + 4; strokePaths(l); }
    ctx.strokeStyle = col(load(l, ti)); ctx.lineWidth = width(l.v[ti]); strokePaths(l);
  }
}
function strokePaths(l) { l.pp.forEach(path => { ctx.beginPath(); path.forEach(([x, y], j) => j ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y))); ctx.stroke(); }); }

function nearest(mx, my) {
  let best = -1, bd = 9 * 9;
  L.forEach((l, i) => l.pp.forEach(path => { for (let j = 1; j < path.length; j++) {
    const ax = sx(path[j - 1][0]), ay = sy(path[j - 1][1]), bx = sx(path[j][0]), by = sy(path[j][1]);
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1;
    let t = ((mx - ax) * dx + (my - ay) * dy) / L2; t = Math.max(0, Math.min(1, t));
    const ex = ax + t * dx - mx, ey = ay + t * dy - my, d = ex * ex + ey * ey;
    if (d < bd) { bd = d; best = i; } } }));
  return best;
}
const fmt = v => v == null ? '—' : Math.round(v).toLocaleString('ja-JP');
const pct = r => r == null ? '容量なし' : Math.round(r * 100) + '%';
const hm = t => t ? `${+t.slice(5, 7)}/${+t.slice(8, 10)} ${t.slice(11)}` : '—';
const area = a => (LN.areas || {})[a] || a;
const CONF = { A: '名前と両端で照合', B: '両端だけで照合', C: '片端と線名で照合' };
function lineText(l) {
  const r = load(l, ti), c = capOf(l, ti);
  return `<b>${esc(l.n)}</b> <span style="color:var(--muted)">${esc(area(l.a))}・${l.kv} kV</span><br>`
    + `潮流 <b style="font-family:var(--f-num)">${fmt(l.v[ti])} MW</b>(正: ${esc(l.d)})<br>`
    + `運用容量 ${c ? fmt(c.cap) + ' MW' : '—'} → ${pct(r)}${c && c.f ? `(${esc(c.f)}${c.note ? '・' + c.note : ''})` : ''}<br>`
    + `<span style="color:var(--muted)">${l.pp.length ? (CONF[l.c] || '') : '地図に描けない線路(#141)'}</span>`;
}
function showDetail() {
  const box = $('detail');
  if (sel < 0 || !L[sel]) { box.innerHTML = '<span class="k">地図の線か、上の一覧を押すと出ます</span>'; return; }
  const l = L[sel], n = T.length, w = 300, h = 70;
  const vs = T.map((_, i) => l.v[i] ?? null);
  const caps = T.map((_, i) => (capOf(l, i) || {}).cap || 0);
  const mx = Math.max(1, ...vs.map(v => Math.abs(v ?? 0)), ...caps);
  const X = i => (n > 1 ? i / (n - 1) * w : 0).toFixed(1);
  const y = v => (h / 2 - (v / mx) * (h / 2 - 4)).toFixed(1);
  const pts = vs.map((v, i) => v == null ? null : `${X(i)},${y(v)}`).filter(Boolean).join(' ');
  const capPts = s => caps.map((c, i) => c ? `${X(i)},${y(s * c)}` : null).filter(Boolean).join(' ');
  const capl = caps.some(Boolean) ? `<polyline points="${capPts(1)}" fill="none" stroke="var(--l4)" stroke-dasharray="3 3" stroke-width="1"/><polyline points="${capPts(-1)}" fill="none" stroke="var(--l4)" stroke-dasharray="3 3" stroke-width="1"/>` : '';
  const d1 = T.findIndex(t => t.slice(0, 10) !== T[0].slice(0, 10));
  const dayl = d1 > 0 ? `<line x1="${X(d1)}" x2="${X(d1)}" y1="0" y2="${h}" stroke="var(--rule)" stroke-width="1"/>` : '';
  box.innerHTML = `<div>${lineText(l)}</div>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(l.n)} の潮流(${hm(T[0])} から ${hm(T[n - 1])})">
      <line x1="0" x2="${w}" y1="${h / 2}" y2="${h / 2}" stroke="var(--rule)" stroke-width="1"/>${dayl}${capl}
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <line x1="${X(ti)}" x2="${X(ti)}" y1="0" y2="${h}" stroke="var(--muted)" stroke-width="1"/>
    </svg>
    <span class="k">${hm(T[0])} 〜 ${hm(T[n - 1])}${d1 > 0 ? '(縦の細線が日付の変わり目)' : ''}。点線は運用容量</span>`;
}
function side() {
  const have = L.map((l, i) => i).filter(i => L[i].v[ti] != null);
  const rs = have.map(i => [i, load(L[i], ti)]).filter(([, r]) => r != null).sort((a, b) => b[1] - a[1]);
  $('s-n').textContent = have.length;
  $('s-80').textContent = rs.filter(([, r]) => r >= .8).length;
  $('s-max').textContent = rs.length ? pct(rs[0][1]) : '—';
  $('top').innerHTML = rs.slice(0, 10).map(([i, r]) => {
    const l = L[i];
    return `<li class="row${i === sel ? ' on' : ''}" tabindex="0" data-i="${i}"><span class="nm">${esc(l.n)}<em>${esc(area(l.a))}・${l.kv}kV${l.pp.length ? '' : '・地図に無い'}</em></span><span class="pct" style="background:${col(r)}">${pct(r)}</span></li>`;
  }).join('');
  $('top').querySelectorAll('li').forEach(li => {
    const go = () => { sel = +li.dataset.i; draw(); side(); showDetail(); };
    li.onclick = go; li.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
  const ics = Object.entries(TD.ic || {});
  $('ic').innerHTML = ics.length ? ics.map(([nm, arr]) => {
    const x = arr[ti];
    if (!x) return `<div class="icr"><div class="top"><span>${esc(nm)}</span><span>—</span></div></div>`;
    const [fl, cf, cr] = x, sp = (cf - cr) || 1;
    const zero = (-cr) / sp * 100;
    const end = Math.max(0, Math.min(100, zero + fl / sp * 100));   // 容量を超えたら端で止める
    const a = Math.min(zero, end), b = Math.abs(end - zero);
    return `<div class="icr"><div class="top"><span>${esc(nm)}</span><span>${fmt(fl)} MW${fl > cf || fl < cr ? ' ⚠ 容量超え' : ''}</span></div>
      <div class="bar" title="逆 ${fmt(cr)} 〜 順 ${fmt(cf)} MW"><span class="z" style="left:${zero}%"></span><span class="f" style="left:${a}%;width:${Math.max(b, .5)}%"></span></div></div>`;
  }).join('') : '<span class="k" style="color:var(--muted)">この回は取れなかった</span>';
}
function setTime(i) { ti = Math.max(0, Math.min(T.length - 1, i)); $('t').value = ti; $('clock').textContent = hm(T[ti]); draw(); side(); showDetail(); }

function status() {
  const made = new Date(TD.made), age = Date.now() - made.getTime();
  const mk = `${made.getMonth() + 1}/${made.getDate()} ${String(made.getHours()).padStart(2, '0')}:${String(made.getMinutes()).padStart(2, '0')}`;
  $('status').innerHTML = `最新の値 <b>${hm(T[T.length - 1])}</b>・最後の取得 <b>${mk}</b>(毎時)`
    + (age > STALE_MS ? ` <span class="stale">更新が止まっています(${Math.floor(age / 3600000)} 時間前の取得)</span>` : '');
}
function foot() {
  const nDraw = LN.lines.filter(l => l.p.length).length;
  $('foot').innerHTML = `<p>出典: ${esc(TD.source)}(${esc(TD.days[0])}〜${esc(TD.days[TD.days.length - 1])})を加工して作成。`
    + `原典は <a href="https://occtonet3.occto.or.jp/public/dfw/RP11/OCCTO/SD/LOGIN_login">OCCTO 系統情報サービス</a>。毎時取り直して載せている。時刻は公表の表記のまま。</p>`
    + `<p>線の形は All-Japan-Grid のモデルの線で、OCCTO の線路の両端の変電所から照合した(${LN.lines.length} 線路のうち ${nDraw} を描ける。`
    + `描けない線路は一覧にだけ出る。理由と直し方は <a href="https://github.com/lutelute/All-Japan-Grid/issues/141">#141</a>)。`
    + `運用容量は同じ日の実績を線路名で突き合わせ、潮流の向きに合う値があればそれ、無ければ公表されている値を使った。</p>`
    + `<p>研究のための表示で、運用の判断には使わないでください。</p>`;
}

async function refresh(first) {
  try {
    const td = await getJSON('occto_today.json');
    lastLoad = Date.now();
    if (!first && td.made === TD.made) { status(); return; }
    const atEnd = first || ti >= T.length - 1, selId = sel >= 0 && L[sel] ? L[sel].id : null;
    TD = td; build();
    sel = selId ? L.findIndex(l => l.id === selId) : -1;
    $('t').max = Math.max(0, T.length - 1);
    status(); foot();
    $('msg').hidden = T.length > 0;
    if (!T.length) { $('msg').textContent = 'まだ値がありません'; return; }
    setTime(atEnd ? T.length - 1 : ti);
  } catch (e) {
    if (first) { $('msg').hidden = false; $('msg').textContent = `データを読めませんでした(${e.message})`; $('status').textContent = ''; }
  }
}

async function init() {
  try {
    LN = await getJSON('occto_lines.json');
  } catch (e) { $('msg').textContent = `線路の一覧を読めませんでした(${e.message})`; $('status').textContent = ''; return; }
  land = (LN.outline || []).map(r => r.map(P));
  land.forEach(r => r.forEach(([x, y]) => { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); }));
  fit();
  await refresh(true);
  setInterval(() => refresh(false), REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastLoad > REFRESH_MS) refresh(false); });
}

// 操作
$('t').oninput = e => setTime(+e.target.value);
$('play').onclick = () => {
  if (playing) { clearInterval(playing); playing = null; $('play').textContent = '▶ 再生'; return; }
  if (!T.length) return;
  if (ti >= T.length - 1) ti = -1;
  $('play').textContent = '❚❚ 止める';
  playing = setInterval(() => { if (ti >= T.length - 1) { $('play').click(); return; } setTime(ti + 1); }, 350);
};
// 拡大は、最初に全体を収めた倍率(sc0)の 0.5〜60 倍。ホイールと、指 2 本(ピンチ)
let drag = null, pinch = null;
const touches = new Map();
const zoomTo = (ns, cx, cy, base) => { ns = Math.max(sc0 * 0.5, Math.min(ns, sc0 * 60)); const kk = ns / base.sc; ox = cx - (cx - base.ox) * kk; oy = cy - (cy - base.oy) * kk; sc = ns; draw(); };
const gap = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) || 1;
cv.addEventListener('pointerdown', e => {
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY }); try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 合成のイベントなど */ }
  if (touches.size === 2) {
    const [a, b] = [...touches.values()], r = cv.getBoundingClientRect();
    pinch = { d: gap(a, b), sc, ox, oy, cx: (a.x + b.x) / 2 - r.left, cy: (a.y + b.y) / 2 - r.top }; drag = null; return;
  }
  drag = { x: e.clientX, y: e.clientY, ox, oy, moved: false }; cv.style.cursor = 'grabbing';
});
const lift = e => { touches.delete(e.pointerId); if (touches.size < 2) pinch = null; };
cv.addEventListener('pointercancel', e => { lift(e); drag = null; });
cv.addEventListener('pointermove', e => {
  if (!TD) return;
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && touches.size === 2) { const [a, b] = [...touches.values()]; zoomTo(pinch.sc * gap(a, b) / pinch.d, pinch.cx, pinch.cy, pinch); return; }
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; ox = drag.ox + dx; oy = drag.oy + dy; draw(); return; }
  const i = nearest(mx, my), tip = $('tip');
  if (i !== hover) { hover = i; draw(); }
  if (i < 0) { tip.hidden = true; return; }
  tip.innerHTML = lineText(L[i]); tip.hidden = false;
  tip.style.left = Math.max(4, Math.min(mx + 14, W - 290)) + 'px'; tip.style.top = Math.max(4, Math.min(my + 14, H - 110)) + 'px';
});
cv.addEventListener('pointerup', e => {
  const wasPinch = touches.size === 2; lift(e);
  cv.style.cursor = 'grab';
  if (TD && drag && !drag.moved && !wasPinch) { const r = cv.getBoundingClientRect(); sel = nearest(e.clientX - r.left, e.clientY - r.top); side(); showDetail(); draw(); }
  drag = null;
});
cv.addEventListener('pointerleave', () => { $('tip').hidden = true; if (hover >= 0) { hover = -1; draw(); } });
cv.addEventListener('wheel', e => {
  e.preventDefault(); const r = cv.getBoundingClientRect();
  zoomTo(sc * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top, { sc, ox, oy });
}, { passive: false });
new ResizeObserver(() => { fit(); if (TD) draw(); }).observe($('mapbox'));
const redraw = () => { if (TD) { draw(); side(); } };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
$('ramp').innerHTML = ['--l0', '--l1', '--l2', '--l3', '--l4'].map(c => `<i style="background:var(${c})"></i>`).join('') + '<span>0 → 30 → 60 → 85 → 100%</span>';
init();
})();
</script>
</body>
</html>
