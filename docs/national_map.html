<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全国系統 接続確認マップ — powerflow_national</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  #map { height: 100%; }
  .panel {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: rgba(255,255,255,.95); border-radius: 8px; padding: 12px 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 13px; max-width: 300px;
  }
  .panel h1 { font-size: 14px; margin: 0 0 8px; }
  .panel .row { margin: 6px 0; }
  .panel label { margin-right: 8px; cursor: pointer; }
  .panel .meta { color: #666; font-size: 11px; margin-top: 8px; line-height: 1.5; }
  .legend { position: absolute; bottom: 18px; right: 10px; z-index: 1000;
    background: rgba(255,255,255,.95); border-radius: 8px; padding: 10px 12px;
    font-size: 11px; box-shadow: 0 1px 6px rgba(0,0,0,.3); }
  .legend .sw { display: inline-block; width: 14px; height: 8px; margin-right: 4px;
    vertical-align: middle; border-radius: 2px; }
  .err { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
    z-index: 1100; background: #fff3f3; border: 1px solid #e99; border-radius: 8px;
    padding: 18px 22px; font-size: 14px; max-width: 480px; display: none; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>全国系統 接続確認マップ</h1>
  <div class="row">地域:
    <select id="regionSel">
      <option value="all" selected>全国（10地域）</option>
    </select>
  </div>
  <div class="row">解:
    <label><input type="radio" name="mode" value="ac" checked> AC</label>
    <label><input type="radio" name="mode" value="dc"> DC</label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="cbBuses" checked> バス（電圧）</label>
    <label><input type="checkbox" id="cbLines" checked> 送電線</label>
  </div>
  <div class="meta">
    線の端点はバス座標へ吸着済み（接触100%・台帳82）。
    <b>ここで隙間が見えたらそれはモデル実体の欠落</b>であり描画ズレではない。
    変圧器=紫点線（異電圧接続）、合成橋（recon）=灰点線。
  </div>
  <div class="meta" id="meta">読込中…</div>
</div>
<div class="legend" id="legend"></div>
<div class="err" id="err"></div>
<script>
const DATA = "data/powerflow_national";
const REGIONS = ["hokkaido","tohoku","tokyo","chubu","hokuriku",
                 "kansai","chugoku","shikoku","kyushu","okinawa"];
const map = L.map("map", { preferCanvas: true }).setView([36.5, 137.5], 6);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { attribution: "&copy; OpenStreetMap", maxZoom: 18, opacity: .55 }).addTo(map);

let mode = "ac", regionPick = "all";
const cache = {};                 // url -> geojson
let busLayer = null, lineLayer = null;

const vmColor = v => v == null ? "#999"
  : v < 0.90 ? "#c0392b" : v < 0.95 ? "#e67e22"
  : v <= 1.05 ? "#27ae60" : v <= 1.07 ? "#e67e22" : "#c0392b";
const ldColor = v => v == null ? "#bbb"
  : v < 50 ? "#27ae60" : v < 80 ? "#f1c40f" : v < 100 ? "#e67e22" : "#c0392b";

async function fetchFC(url) {
  if (cache[url]) return cache[url];
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  cache[url] = await r.json();
  return cache[url];
}

function legendHTML() {
  return `
    <b>バス電圧 vm [pu]</b>
    <span class="sw" style="background:#c0392b"></span>&lt;0.90
    <span class="sw" style="background:#e67e22"></span>0.90–0.95
    <span class="sw" style="background:#27ae60"></span>0.95–1.05<br>
    <b>線 loading [%]</b>
    <span class="sw" style="background:#27ae60"></span>&lt;50
    <span class="sw" style="background:#f1c40f"></span>50–80
    <span class="sw" style="background:#e67e22"></span>80–100
    <span class="sw" style="background:#c0392b"></span>&gt;100<br>
    <span class="sw" style="background:#8e44ad"></span>変圧器（異電圧・点線）
    <span class="sw" style="background:#888"></span>合成橋（点線）`;
}

async function redraw() {
  const regs = regionPick === "all" ? REGIONS : [regionPick];
  const meta = document.getElementById("meta");
  meta.textContent = "読込中…";
  let nb = 0, nl = 0, nt = 0;
  const busFeats = [], lineFeats = [];
  for (const r of regs) {
    try {
      const [bs, ls] = await Promise.all([
        fetchFC(`${DATA}/${r}_${mode}_buses.geojson`),
        fetchFC(`${DATA}/${r}_${mode}_lines.geojson`)]);
      busFeats.push(...bs.features);
      lineFeats.push(...ls.features);
    } catch (e) {
      console.warn(r, e);
    }
  }
  if (busLayer) { map.removeLayer(busLayer); busLayer = null; }
  if (lineLayer) { map.removeLayer(lineLayer); lineLayer = null; }
  if (document.getElementById("cbLines").checked) {
    lineLayer = L.geoJSON({type: "FeatureCollection", features: lineFeats}, {
      style: f => {
        const p = f.properties;
        if (p.trafo) return { color: "#8e44ad", weight: 2.0, opacity: .9,
                              dashArray: "5 4" };
        if (p.synthetic) return { color: "#888", weight: 1.2, opacity: .7,
                                  dashArray: "6 5" };
        return { color: ldColor(p.loading_pct), weight: p.tie ? 2.4 : 1.5,
                 opacity: .85 };
      },
      onEachFeature: (f, ly) => {
        const p = f.properties;
        nl++; if (p.trafo) nt++;
        ly.bindTooltip(
          `${p.name}<br>loading ${p.loading_pct}% / p ${p.p_mw} MW` +
          (p.trafo ? "<br><b>変圧器</b>（異電圧接続）" : "") +
          (p.synthetic ? "<br><b>合成橋</b>（推定接続・recon）" : ""),
          {sticky: true});
      }
    }).addTo(map);
  }
  if (document.getElementById("cbBuses").checked) {
    busLayer = L.geoJSON({type: "FeatureCollection", features: busFeats}, {
      pointToLayer: (f, latlng) => {
        const p = f.properties;
        nb++;
        return L.circleMarker(latlng, {
          radius: (p.vn_kv >= 154) ? 4 : 2.5,
          color: vmColor(p.vm_pu), fillColor: vmColor(p.vm_pu),
          fillOpacity: .85, weight: 1,
        }).bindTooltip(
          `${p.name} (${p.vn_kv}kV)<br>vm ${p.vm_pu} pu / va ${p.va_deg}°`,
          {sticky: true});
      }
    }).addTo(map);
  }
  meta.innerHTML = `表示: バス ${nb.toLocaleString()} / 線 ` +
    `${(nl - nt).toLocaleString()} / 変圧器 ${nt.toLocaleString()}（${mode.toUpperCase()}解）`;
}

const sel = document.getElementById("regionSel");
for (const r of REGIONS) {
  const o = document.createElement("option");
  o.value = r; o.textContent = r;
  sel.appendChild(o);
}
sel.addEventListener("change", () => { regionPick = sel.value; redraw(); });
document.querySelectorAll('input[name="mode"]').forEach(el =>
  el.addEventListener("change", () => { mode = el.value; redraw(); }));
document.getElementById("cbBuses").addEventListener("change", redraw);
document.getElementById("cbLines").addEventListener("change", redraw);
document.getElementById("legend").innerHTML = legendHTML();
redraw();
</script>
</body>
</html>
