<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>潮流方向・発電稼働率マップ — AGJ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:1000;background:rgba(255,255,255,.95);
         border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.3);padding:10px 12px;font-size:12px}
  #ctrl{top:10px;left:10px;max-width:280px}
  #ucpanel{bottom:10px;left:10px;max-width:340px;max-height:44vh;overflow:auto}
  #legend{top:10px;right:10px}
  .tab{display:inline-block;padding:3px 10px;margin:2px;border:1px solid #888;
       border-radius:12px;cursor:pointer;user-select:none}
  .tab.on{background:#2c3e50;color:#fff;border-color:#2c3e50}
  .sw{display:inline-block;width:14px;height:8px;border-radius:2px;vertical-align:middle}
  .arrowIcon{pointer-events:none;font-size:14px;line-height:14px;color:#1b4f72;
             text-shadow:0 0 2px #fff,0 0 2px #fff}
  .bar{height:9px;background:#e8edf2;border-radius:4px;overflow:hidden;margin:1px 0}
  .bar>i{display:block;height:100%;background:#2980b9}
  h4{margin:4px 0 6px}
  .muted{color:#777}
  .fchip{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:3px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="ctrl">
  <h4>潮流方向・発電稼働率</h4>
  <div id="tabs"></div>
  <label><input type="checkbox" id="cbArrow" checked> 潮流方向の矢印(zoom≥9)</label><br>
  <label><input type="checkbox" id="cbGen" checked> 発電バス(円=定格・塗り=出力率)</label><br>
  <label><input type="checkbox" id="cbObs"> 観測方向の検証のみ表示</label>
  <div class="muted" id="stat"></div>
</div>
<div class="panel" id="legend">
  <b>線 loading[%]</b><br>
  <span class="sw" style="background:#2980b9"></span>&lt;40
  <span class="sw" style="background:#27ae60"></span>40-80
  <span class="sw" style="background:#f39c12"></span>80-120
  <span class="sw" style="background:#e74c3c"></span>&gt;120<br>
  <b>観測方向</b>: <span style="color:#27ae60">●一致</span> /
  <span style="color:#c0392b">●不一致</span><br>
  <b>発電</b>: 円=定格MW・塗り=出力率
</div>
<div class="panel" id="ucpanel">
  <h4>UC稼働率(fy2023・24h) <span class="muted">定格に対する出力</span></h4>
  <div id="ucsel"></div>
  <div id="ucbody" class="muted">読み込み中…</div>
</div>
<script>
const ISLANDS = {east:[37.5,139.8,6], west:[34.7,134.5,6], hokkaido:[43.2,142.5,6], okinawa:[26.4,127.8,9]};
const FUELCOL = {nuclear:"#8e44ad", coal:"#5d4037", lng:"#e67e22", oil:"#95a5a6",
                 hydro:"#2980b9", pumped_hydro:"#5dade2", solar:"#f1c40f",
                 wind:"#1abc9c", geothermal:"#c0392b", biomass:"#27ae60"};
const map = L.map("map").setView([37.5,137.5],5);
L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",
  {attribution:"地理院タイル | AGJ (潮流=モデル計算値・観測方向は公表実績との一致のみ)"}).addTo(map);
let lineLayer=null, genLayer=null, arrowLayer=L.layerGroup().addTo(map);
let cur="west", flows=null, gens=null;

function loadColor(l){return l>120?"#e74c3c":l>80?"#f39c12":l>40?"#27ae60":"#2980b9";}
function bearing(a,b){return Math.atan2(b[0]-a[0], b[1]-a[1])*180/Math.PI;}

function renderArrows(){
  arrowLayer.clearLayers();
  if(!flows || !document.getElementById("cbArrow").checked || map.getZoom()<9) return;
  const bb = map.getBounds();
  let n=0;
  for(const f of flows.features){
    if(n>600) break;
    const cs = f.geometry.coordinates;
    const p = f.properties.p_mw;
    if(Math.abs(p) < 0.5) continue;
    if(document.getElementById("cbObs").checked && f.properties.obs_dir===undefined) continue;
    const mid=[(cs[0][1]+cs[1][1])/2,(cs[0][0]+cs[1][0])/2];
    if(!bb.contains(mid)) continue;
    let a=[cs[0][1],cs[0][0]], b=[cs[1][1],cs[1][0]];
    if(p<0){const t=a;a=b;b=t;}
    const ang = bearing(a,b);
    L.marker(mid,{icon:L.divIcon({className:"arrowIcon",
      html:`<div style="transform:rotate(${ang}deg)">▲</div>`,iconSize:[14,14]}),
      interactive:false}).addTo(arrowLayer);
    n++;
  }
}

async function show(island){
  cur=island;
  document.querySelectorAll("#tabs .tab").forEach(t=>t.classList.toggle("on",t.dataset.k===island));
  const [fl,gn]=await Promise.all([
    fetch(`data/flow_map/flows_${island}.geojson`).then(r=>r.json()),
    fetch(`data/flow_map/gens_${island}.geojson`).then(r=>r.json())]);
  flows=fl; gens=gn;
  if(lineLayer) map.removeLayer(lineLayer);
  if(genLayer) map.removeLayer(genLayer);
  const obsOnly=()=>document.getElementById("cbObs").checked;
  lineLayer=L.geoJSON(fl,{
    filter:f=>!obsOnly()||f.properties.obs_dir!==undefined,
    style:f=>({color:loadColor(f.properties.loading_pct),
               weight:Math.min(1+Math.abs(f.properties.p_mw)/300,6),
               opacity: f.properties.obs_dir===undefined?0.55:0.95}),
    onEachFeature:(f,ly)=>{
      const p=f.properties;
      let s=`<b>${p.name||"(無名)"}</b><br>p=${p.p_mw} MW / loading ${p.loading_pct}%`;
      if(p.obs_dir!==undefined)
        s+=`<br>観測方向: ${p.obs_dir?"<span style=color:#27ae60>一致</span>":"<span style=color:#c0392b>不一致</span>"}`;
      ly.bindPopup(s);
      if(p.obs_dir!==undefined)
        ly.setStyle({color:p.obs_dir?"#27ae60":"#c0392b"});
    }}).addTo(map);
  genLayer=L.layerGroup();
  if(document.getElementById("cbGen").checked){
    for(const f of gn.features){
      const p=f.properties, c=f.geometry.coordinates;
      const r=Math.max(3,Math.sqrt(p.pmax_mw)/3);
      const col=FUELCOL[p.fuel]||"#7f8c8d";
      L.circleMarker([c[1],c[0]],{radius:r,color:col,weight:1.5,
        fillColor:col,fillOpacity:Math.min(0.15+0.85*p.cf,1)})
       .bindPopup(`<b>${p.name}</b><br>定格 ${p.pmax_mw} MW / 出力 ${p.pg_mw} MW`+
                  `<br>出力率 <b>${(p.cf*100).toFixed(1)}%</b> / 主燃料 ${p.fuel}`)
       .addTo(genLayer);
    }
  }
  genLayer.addTo(map);
  renderArrows();
  const nb=fl.features.filter(f=>f.properties.obs_dir!==undefined);
  const ok=nb.filter(f=>f.properties.obs_dir).length;
  document.getElementById("stat").textContent=
    `線${fl.features.length} / 発電バス${gn.features.length} / 観測方向照合${nb.length}(一致${ok})`;
  const v=ISLANDS[island]; map.setView([v[0],v[1]],v[2]);
}

const tabs=document.getElementById("tabs");
for(const k of Object.keys(ISLANDS)){
  const t=document.createElement("span");
  t.className="tab"; t.dataset.k=k; t.textContent=k;
  t.onclick=()=>show(k); tabs.appendChild(t);
}
map.on("zoomend moveend",renderArrows);
["cbArrow","cbGen","cbObs"].forEach(id=>
  document.getElementById(id).onchange=()=>show(cur));

// --- UC稼働率パネル ---
fetch("data/flow_map/uc_utilization.json").then(r=>r.json()).then(d=>{
  const regions=[...new Set(Object.keys(d.groups).map(k=>k.split("|")[0]))];
  const sel=document.getElementById("ucsel");
  const selEl=document.createElement("select");
  regions.forEach(r=>{const o=document.createElement("option");o.value=r;o.textContent=r;selEl.appendChild(o);});
  selEl.value=regions.includes("kansai")?"kansai":regions[0];
  sel.appendChild(selEl);
  const body=document.getElementById("ucbody");
  function draw(){
    const reg=selEl.value; body.innerHTML=""; body.className="";
    for(const [k,v] of Object.entries(d.groups)){
      const [r,fuel]=k.split("|");
      if(r!==reg||!v.capacity_mw) continue;
      const col=FUELCOL[fuel]||"#7f8c8d";
      const row=document.createElement("div");
      row.innerHTML=`<span class="fchip" style="background:${col}"></span>`+
        `${fuel} <span class="muted">${v.capacity_mw.toLocaleString()}MW</span>`+
        ` 平均<b>${v.cf_mean!=null?(v.cf_mean*100).toFixed(0):"—"}%</b>`+
        `/ピーク${v.cf_peak!=null?(v.cf_peak*100).toFixed(0):"—"}%`+
        `<div class="bar"><i style="width:${Math.min((v.cf_mean||0)*100,100)}%;background:${col}"></i></div>`;
      const cv=document.createElement("canvas");
      cv.width=320; cv.height=26; cv.style.width="100%";
      const ctx=cv.getContext("2d");
      const arr=v.dispatch24_mw||[];
      const mx=Math.max(v.capacity_mw,1);
      arr.forEach((x,i)=>{ctx.fillStyle=col;
        const h=Math.max(1,24*x/mx);
        ctx.fillRect(i*13.3,26-h,11,h);});
      ctx.strokeStyle="#bbb"; ctx.strokeRect(0,0,320,26);
      row.appendChild(cv);
      body.appendChild(row);
    }
    const note=document.createElement("div");
    note.className="muted";
    note.textContent=`シナリオ: ${d.scenario}(棒=時刻別出力/枠上端=定格)`;
    body.appendChild(note);
  }
  selEl.onchange=draw; draw();
}).catch(()=>{document.getElementById("ucbody").textContent="uc_utilization.json 未生成";});

show("west");
</script>
</body>
</html>
