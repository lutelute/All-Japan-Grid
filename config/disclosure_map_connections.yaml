# 運用: 図PDF（転載禁止・data/external内）の判読で確認できた接続だけを載せる。
#   - frm = 孤立側のモデル実名 / to = 相手側のモデル実名（変異名可・region優先でpickされる）
#   - src に 図ファイル名とページ、判読の根拠（線名ラベル等）を必ず書く
#   - 判読エージェントの出力は人間(主セッション)がサンプル検証してからここに移す
#   - 図に無い接続・無名記号への接続は載せない（捏造禁止）
# 無効化: 行を消す or apply_disclosure_v2 --disable disclosure_map。

