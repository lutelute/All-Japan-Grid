# OCCTO の地内基幹送電線の端(変電所・開閉所・発電所)の位置の台帳(潮流マップの表示だけに使う)
#
# 背景(2026-11-07): OCCTO の潮流実績の線路は、両端の変電所名と線路名だけを持つ。
# scripts/build_occto_line_crosswalk.py は両端をモデル・OSM の名前で引いて位置を出すが、
# 次の端は引けなかった(引けないと、その線路は地図に描けない)。
#   - モデルにも手元の OSM の層にも名前が無い(名古屋の 275 kV の地下の変電所、OSM に名前の無い変電所)
#   - 名前が 2 文字で、解決器の索引に入らない(「田原」「金山」「高根」。MIN_KEY_LEN = 3)
#   - 同じ名前の別の所を引いた(東北の「福島」→北海道の福島町、北陸の「南条」→長野)
#
# 運用規約:
#   - 位置は表示(潮流マップの点と模式の点線)だけに使う。モデルの節点・接続・照合は変えない
#   - 座標は開かれた出典から取る(ref に書く):
#       osm:<種類>/<番号> = OSM の要素(ODbL)の中心 / gsi:注記 = 地理院地図の注記 / gsi:記号 = 地理院地図の記号 /
#       gsi:住所 = 資料の住所を地理院の住所検索で引いた点 / gsi:写真 = 地理院の空中写真で設備を確かめて読んだ点
#     住所や名前の出典の資料は src に書く
#   - 各社の空き容量マップと、それをまとめた REI の送電線マップ(All Rights Reserved)は、
#     当たりを付けるのに使ってよいが、座標の出典にはしない
#   - 名前の取り違え(同じ名前の別の設備・鉄道の変電所)を防ぐため、電圧か線路名で確かめたものだけを入れる
#   - conf: 高 = 名前と電圧(か設備の種類)が合う / 中 = 名前の読み替えや敷地の推定が要る / 低 = 所在地の資料が無く推定
#   - 誤りが分かったら行を消す(git の履歴が台帳)
#
# 鍵は (area, name)。name は OCCTO の向きの欄を station_name() でそろえた名前(「北新得SS」→「北新得変電所」)。
