# 公表の接続で繋ぎ先の電圧が分かる大型機の台帳 — 介入#55(2026-10-28)
#
# 各社の「系統情報の公表」(空容量・予想潮流一覧)で、発電所の名前のついた線・構内の変電所が載っている機だけ。
# 繋ぎ先の規則(#24 cap / #41 capkv)は外部の接続電圧表を持ち込まずに推定していたが、これは一次資料そのもの。
#
# 運用:
#   - name   = data/<region>_plants.geojson の name(OSM)。同じ名前の地物すべてに当たる
#   - kv     = 発電機の出力が網に入る電圧(構内の変電所の一次側・発電所の名前のついた線の電圧の最上位)
#   - to     = 公表の相手で、網のバス名まで同定できたもの(任意)。あれば kv のバスのうちこれを先に選ぶ
#   - at     = 構内の点 [緯度, 経度](任意・2026-10-29)。構内の変電所から公表の線が出る鉄塔を、網の線の端と
#              地図・空中写真(国土地理院 シームレス空中写真)で確かめたもの。網では分岐点(変電所でない)なので
#              to では引けない。0.5 km 以内で電圧が kv のバスを、ほかより先に選ぶ
#   - 繋ぎ先 = at の点 → 25 km 以内で電圧が kv のバスのうち、to にあるもの → 最寄り。無ければ島の規則のまま(未解決として数える)
#   - evidence には、資料・番号・線名・電圧・回線数・区間だけを書く。容量・潮流の値は書かない(転載不可)
#   - 資料の写しは data/external/system_disclosure/<utility>/capacity/(git の外)
# 無効化: 行を消す / `--no-plant-connections`(全規模の潮流・配布ケース)/ 定数 PLANT_CONNECTIONS=False

plants:
  # ── 中部(KRSIH010=275kV 以上送電線・変電所、KRSIH011=尾張・知多 154kV 以下、KRSIH013=三重 154kV 以下。2026-08-31 更新)
  - name: 知多火力発電所
    kv: 275
    at: [34.98810, 136.84663]
    to: [大字石浜変電所 275kV, 東名古屋変電所 275kV]
    evidence: >-
      KRSIH010 No.500 知多火力東浦線 275kV 2回線 知多火力変電所→東浦開閉所、No.620 知多火力線 275kV 2回線
      知多火力変電所→東名古屋変電所。変電所 No.1008/1026 知多火力変電所 275/154kV・275/77kV。
      大字石浜変電所=東浦開閉所(OSM「東浦北豊田線」の端・公表の東浦北豊田線は東浦開閉所→北豊田変電所)。
      at=網の 275kV の分岐点(知多市北浜町・発電所の点から 0.27 km)。ここから網の 275kV の線が東浦開閉所
      (2 回線)・東名古屋・東海へ出る。空中写真で、点は構内の屋外変電所の脇の鉄塔
  - name: 知多第二火力発電所
    kv: 275
    to: [東海町六丁目変電所]
    evidence: >-
      KRSIH010 No.580 知多第二東海線 275kV 2回線(区間の記載なし)。KRSIH011 No.1002 東海変電所 275/154kV。
      東海変電所=東海町六丁目変電所(推定・2026-10-29): OSM の変電所(osm_id 253528801)に ref=東海、
      所在は東海市(地理院の逆ジオコーダで新宝町)、網で新名古屋側と知多側からの 275kV の線が集まる。
      空中写真では工場地帯で、変電所の敷地は判別できなかった
  - name: 川越火力発電所
    kv: 275
    to: [西名古屋変電所 275kV]
    evidence: KRSIH010 No.270 川越火力線 275kV 2回線 川越火力変電所→西名古屋変電所
  - name: 武豊火力発電所
    kv: 154
    at: [34.82429, 136.92118]
    evidence: >-
      KRSIH011 No.10271 武豊火力-1・No.10272 武豊火力線-2 154kV 各2回線 武豊変電所→知多変電所。
      変電所 No.1027 武豊火力変電所 154/77kV。
      at=網の 154kV の分岐点(発電所の点から 0.27 km)。網の 154kV を北へ辿ると岩滑を経て原二丁目変電所
      (知多市八幡・知多変電所の候補)に届く。空中写真で、点は発電所と構内の屋外変電所の脇の鉄塔
  - name: 碧南火力発電所
    kv: 275
    to: [川口町五丁目変電所 275kV]
    evidence: >-
      KRSIH010 No.680 幸田碧南線 275kV 2回線 碧南変電所→幸田変電所。KRSIH016 変電所 No.6001/6004
      碧南変電所 275/154kV・275/77kV、送電線 No.60110 碧南岡崎線 154kV 2回線 碧南変電所→岡崎変電所。
      碧南変電所=川口町五丁目変電所(OSM「碧南岡崎線」の端・nagoya_port_attach_2026-10-28.md)。
      空中写真で、発電所の東の隣の屋外変電所(発電所の点から 0.4 km)
  - name: 四日市火力発電所
    kv: 154
    evidence: >-
      KRSIH013 No.30080〜30083 四日市火力-1〜4 154kV 各2回線(四日市変電所→西名古屋変電所(1) ほか)。
      変電所 No.3603 四日市火力変電所 154/77kV
  - name: 西名古屋火力発電所
    kv: 154
    at: [35.03400, 136.82810]
    to: [名南変電所 154kV]
    evidence: >-
      KRSIH011 No.10181・10182 西名古屋名南-1・-2 154kV 各2回線 名南変電所→西名古屋変電所(2026-10-30)。
      KRSIH010(275kV 以上)には西名古屋火力の線が無い。三重の西名古屋変電所(網 35.083, 136.616)の 154kV の
      線は北と南へ出ていて名南へ向かうものが無いので、この西名古屋は発電所の側と読む。
      at=構内の変電所(飛島村東浜・発電所の北西 0.3 km)。空中写真でガス絶縁の母線と変圧器、角に鉄塔と
      北西へ出る架空線。網ではすぐ北東の東浜三丁目変電所 154kV(0.15 km)から名南変電所へ 6 回線
  # ── 北陸(sys_capa_kikan01_line/tr 2026-08)
  - name: 富山新港火力発電所
    kv: 154
    evidence: H031 富山新港火力線 154kV 2回線 塚原→富山新港火力、H029 草島新港線 154kV 2回線 富山火力→富山新港火力
  - name: 富山火力発電所
    kv: 154
    evidence: H027 火力富山線 154kV 2回線 富山→富山火力、H030 火力塚原線 154kV 2回線 塚原→富山火力
  - name: 敦賀火力発電所
    kv: 275
    at: [35.67390, 136.07840]
    evidence: >-
      H110 敦賀火力線 275kV 2回線 南条→敦賀火力。変電所 HSS011 敦賀火力 275/77kV。
      at=網の 275kV の分岐点(発電所の点から 0.23 km・2026-10-30)。網の線(端の名から自動で付いた
      「奥野々変電所~敦賀変電所線」2 回線)がここから東の山へ出る。空中写真で、点は発電所の北の変電設備の脇
  # ── 中国(sys_capa_kikan01=220kV 以上、local33=岡山、local45/46=広島、local53=山口。2026-07〜08)
  - name: 柳井火力発電所
    kv: 220
    evidence: 基L19 柳井火力連絡線 220kV 2回線 東山口(変)→柳井火力(変)。変電所 基S8 柳井火力変電所 220/110kV
  - name: 竹原火力発電所
    kv: 220
    evidence: >-
      基L28 新竹原火力線 220kV 2回線 新広島(変)→発電所。広⑤L9 竹原火力線 110kV 1回線 呉(変)→発電所
  - name: 水島火力発電所
    kv: 110
    evidence: 岡③L1 水島火力線 110kV 2回線 倉敷(変)→水島火力(変)、岡③L10 水島玉野線 110kV 2回線 玉野(変)→水島火力(変)
  - name: 玉島火力発電所
    kv: 110
    evidence: 岡③L18 新倉敷玉島線 110kV 2回線 新倉敷(変)→玉島火力(変)(様式5 でも玉島火力変電所の区間は 110kV)
  # ── 四国(sys_capa_kikan00_line/tr 2026-08)
  - name: 橘湾火力発電所
    kv: 500
    evidence: No.6 橘湾火力線 500kV 2回線 <7>発電所→阿南変換所
  - name: 阿南火力発電所
    kv: 187
    evidence: No.37 阿南火力線 187kV 2回線。変電所 No.10 阿南火力変電所 187/66kV
  - name: 坂出火力発電所
    kv: 187
    at: [34.34350, 133.84410]
    evidence: >-
      No.28 坂出火力線 187kV 2回線。変電所 No.31 坂出火力変電所 187/66kV。
      at=網の 187kV の分岐点(発電所の点から 0.22 km・2026-10-30)。網の線「受電所~讃岐変電所線」がここを
      通る。空中写真で、点は構内の建物の脇(屋内の変電設備と見られるが写真だけでは確かめきれない)
  - name: 西条発電所
    kv: 187
    evidence: >-
      No.17 西条火力線 187kV 2回線。変電所 No.24 西条火力変電所 187/66kV
      (OSM の「西条発電所」= 四国電力 西条発電所・愛媛県西条市)
  # ── 北海道(sys_capa_kikan01_line 2026-08)
  - name: 京極発電所
    kv: 275
    at: [42.93760, 140.97130]
    evidence: >-
      No.8 京極幹線 275kV 2回線 発電所→後志幹線。
      at=網の 275kV の分岐点(発電所の点から 0.19 km・2026-10-30)。網の線の名前も OSM で「京極幹線」2 回線。
      前は 21.7 km 先の西双葉開閉所に繋いでいて、京極幹線を飛ばしていた。空中写真で、点はダムの脇の林の中で、
      線は南東へ出る
  - name: 苫東厚真火力発電所
    kv: 275
    evidence: No.11 苫東厚真線 275kV 2回線 発電所→南早来変電所
  - name: 石狩湾新港発電所
    kv: 275
    evidence: No.13 石狩火力幹線 275kV 2回線(北海道電力の石狩の火力は石狩湾新港発電所)
  - name: 知内発電所
    kv: 187
    evidence: No.48・49 知内線 187kV 2回線 知内開閉所→大野変電所
  - name: 苫小牧発電所
    kv: 187
    evidence: No.34 苫小牧火力線 187kV 2回線 東苫小牧変電所→苫小牧変電所
