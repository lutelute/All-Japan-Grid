  coal:    {hot: 5000,  warm: 15000, cold: 40000,  warm_start_h: 4, cold_start_h: 12, min_up_h: 4, min_down_h: 4}
  lng:     {hot: 2000,  warm: 5000,  cold: 15000,  warm_start_h: 2, cold_start_h: 8,  min_up_h: 2, min_down_h: 2}
