# 定期検査・計画停止の合成（年間運用でのみ効く。24h断面はメンテ窓外）
# 背景: fy2023r2のRE較正で coal CF~100%（実態62%）のメンテ無し問題が露呈
# （年間ベンチ 2026-06-11: coal 42.0% vs 実績28.3%）。
# 配置は決定論的（md5(gen_id) % 候補週 — 乱数不使用で再現性担保）に
# 春・秋の低需要期（週12-20 / 週38-46）へ分散する。
# duration出典: 定検実態の概数（原子力=13ヶ月毎3ヶ月→年率換算13週、
# 火力=2-6週/年の定検・補修）。経済停止は含まない（残差として開示）。
maintenance:
  # 配置は (地域×燃料) グループ内で容量降順の輪番（決定論・乱数なし）。
  # md5独立配置は秋の集中期に同一地域の大容量機が偶然同時停止し
  # infeasible を起こした（2026-06-11 r4 chunk10 で実測）ため輪番化。
  placement_weeks: [12, 13, 14, 15, 16, 17, 18, 19, 20, 38, 39, 40, 41, 42, 43, 44, 45, 46]
  # 原子力は13週停止が長く秋窓に重なると過大なため、専用の分散スロット
  # （夏ピーク週27-35を回避、6サイトが輪番で別週開始）
  placement_weeks_nuclear: [2, 8, 14, 20, 36, 42]
  duration_weeks_by_fuel:
    nuclear: 13
    coal: 5
    lng: 4
    oil: 4

# [S1] ベンチマークの乖離KPIの正本（総発電ベース、%）。
# モデル側は hydro = hydro+pumped_hydro+hydro_ror 合算で比較する
# （統計の「水力」は揚水発電分を含むため）。oil は統計上「石油等」
# （その他ガス・その他火力込み）でモデルのoilより広い区分。
reference_shares_pct:
  lng: 32.9
  coal: 28.3
  oil: 7.4
  nuclear: 8.5
  hydro: 7.6
  solar: 9.8
  wind: 1.1
  biomass: 4.1
  geothermal: 0.3

references:
  nuclear_status: data/reference/nuclear_status.yaml
  pumped_storage: data/reference/pumped_storage.yaml
  capacity_patches: data/reference/capacity_patches.yaml
