# UCシナリオ定義 — 2023年度断面 (fy2023)
#
# 「発電機の選定・需要・RE・コストはシナリオ依存」という原則の正本ファイル。
# src/uc/scenario.py の load_scenario_config() が読み込み、
# build_national_scenario(scenario="fy2023") の全パラメータを決定する。
# 新しい断面（fy2024、将来計画等）はこのファイルを複製して調整する。
#
# 出典:
# - 需要・RE容量: OCCTO 広域機関 電力需給検証報告書・再エネ導入実績 (2023年度概算)
# - 原子力断面・揚水・容量パッチ: references の各YAML（個別に出典記載）
# - 燃料コスト・起動費: 国内火力の典型推定値（gen_uc_regional.py 由来、要較正）
#
# 旧実装からの移行 (2026-06-11): scripts/gen_uc_regional.py → src/uc/scenario.py に
# ハードコードされていた OCCTO_RE / DEMAND_SHAPE / SOLAR_CF_* / WIND_CF_* /
# FUEL_COST / SU / THERMAL_DEFAULT をこのファイルに集約（二重管理の解消）。

meta:
  name: fy2023
  fiscal_year: 2023
  description: 2023年度断面 — OCCTO 2023年度統計ベースの需要・RE、再稼働12基の原子力

demand:
  # 24時間需要形状（ピーク=1.0、平日夏季典型）
  shape_24h: [0.60, 0.57, 0.55, 0.53, 0.55, 0.60, 0.68, 0.78,
              0.87, 0.93, 0.97, 1.00, 0.99, 0.98, 0.96, 0.93,
              0.90, 0.86, 0.82, 0.78, 0.74, 0.70, 0.66, 0.63]
  regional_peak_mw:
    hokkaido: 6000
    tohoku: 14000
    tokyo: 60000
    chubu: 22000
    hokuriku: 5000
    kansai: 28000
    chugoku: 10000
    shikoku: 5000
    kyushu: 18000
    okinawa: 2000

renewables:
  solar:
    capacity_mw:
      hokkaido: 4000
      tohoku: 7500
      tokyo: 12000
      chubu: 6000
      hokuriku: 1800
      kansai: 5500
      chugoku: 5000
      shikoku: 2000
      kyushu: 15000
      okinawa: 500
    # 太陽光CFベース曲線（24h）× 地域別日照倍率（年間GHI比）
    cf_base_24h: [0, 0, 0, 0, 0, 0.02, 0.10, 0.25, 0.45, 0.65, 0.80, 0.90,
                  0.92, 0.88, 0.78, 0.62, 0.40, 0.18, 0.04, 0, 0, 0, 0, 0]
    regional_multiplier:
      hokkaido: 0.83
      tohoku: 0.92
      tokyo: 1.00
      chubu: 1.03
      hokuriku: 0.90
      kansai: 1.04
      chugoku: 1.06
      shikoku: 1.06
      kyushu: 1.10
      okinawa: 1.13
  wind:
    capacity_mw:
      hokkaido: 4500
      tohoku: 4000
      tokyo: 300
      chubu: 200
      hokuriku: 100
      kansai: 100
      chugoku: 300
      shikoku: 100
      kyushu: 1200
      okinawa: 100
    cf_base_24h: [0.38, 0.40, 0.41, 0.42, 0.40, 0.38, 0.34, 0.30,
                  0.28, 0.27, 0.28, 0.29, 0.30, 0.31, 0.32, 0.33,
                  0.35, 0.37, 0.38, 0.39, 0.40, 0.40, 0.39, 0.38]
    regional_multiplier:
      hokkaido: 1.25
      tohoku: 1.20
      tokyo: 0.70
      chubu: 0.85
      hokuriku: 0.95
      kansai: 0.80
      chugoku: 0.90
      shikoku: 0.90
      kyushu: 1.00
      okinawa: 1.10

# 地域集約蓄電池（OCCTO参照容量）
battery:
  hokkaido: {mw: 300,  mwh: 1200}
  tohoku:   {mw: 400,  mwh: 1600}
  tokyo:    {mw: 500,  mwh: 2000}
  chubu:    {mw: 200,  mwh: 800}
  hokuriku: {mw: 100,  mwh: 400}
  kansai:   {mw: 300,  mwh: 1200}
  chugoku:  {mw: 200,  mwh: 800}
  shikoku:  {mw: 150,  mwh: 600}
  kyushu:   {mw: 1200, mwh: 4800}
  okinawa:  {mw: 100,  mwh: 400}

# 燃料費（円/MWh 相当の一貫単位）
fuel_costs_per_mwh:
  coal: 4500
  lng: 7000
  oil: 9000
  nuclear: 1500
  hydro: 0
  pumped_hydro: 0
  battery: 0
  biomass: 3000
  geothermal: 0
  waste: 5000
  unknown: 5000

# 起動費プロファイル（hot/warm/cold起動費、warm/cold判定時間、min up/down）
startup_profiles:
  nuclear: {hot: 10000, warm: 30000, cold: 100000, warm_start_h: 8, cold_start_h: 48, min_up_h: 8, min_down_h: 8}
  coal:    {hot: 5000,  warm: 15000, cold: 40000,  warm_start_h: 4, cold_start_h: 12, min_up_h: 4, min_down_h: 4}
  lng:     {hot: 2000,  warm: 5000,  cold: 15000,  warm_start_h: 2, cold_start_h: 8,  min_up_h: 2, min_down_h: 2}
  oil:     {hot: 1500,  warm: 3000,  cold: 8000,   warm_start_h: 2, cold_start_h: 6,  min_up_h: 1, min_down_h: 1}

# 容量欠損時の既定値（MW）。火力は小規模自家発スケール（2026-06-11較正、
# 大規模例外は references.capacity_patches で個別補正）
capacity_defaults_mw:
  nuclear: 900
  coal: 100
  lng: 100
  gas: 100
  oil: 100
  geothermal: 30
  waste: 15
  biomass: 20

# 発電機レベルの参照リスト（シナリオの一部: 原子力断面は年度で変わる）
references:
  nuclear_status: data/reference/nuclear_status.yaml
  pumped_storage: data/reference/pumped_storage.yaml
  capacity_patches: data/reference/capacity_patches.yaml
