# OCCTO Regional Peak Demand Data (2023)
# Source: Organization for Cross-regional Coordination of Transmission Operators
# Used for synthetic load allocation in power flow analysis

# Regional peak demand (MW) — OCCTO 2023 summer/winter peak values
regional_peak_demand_mw:
  hokkaido: 5200   # 2026-06-11 (ledger 56): OCCTO実測p95 4,441MW/LF0.85≈5,225 — 旧3,600は夏値で冬ピーク(>5GW)を欠落、reconcileが<q50を検出
  tohoku: 13000
  tokyo: 52000
  chubu: 24000
  hokuriku: 5200
  kansai: 27000
  chugoku: 10500
  shikoku: 4700    # 2026-06-11 (ledger 56): OCCTO実測p95 4,013MW/LF0.85≈4,721 — 旧5,500は過大(snapshot=1.16×p95)、reconcileが検出
  kyushu: 15500
  okinawa: 1600

# Load factor: ratio of allocated demand to peak demand
# Represents typical operating point (not extreme peak)
load_factor: 0.85

# Power factor for load allocation
# cos(phi) = 0.95 → Q = P * tan(acos(0.95))
power_factor: 0.95

# Reactive compensation factor (opt-in via --reactive-comp / reactive_comp=…).
# Fraction of each load bus's reactive demand supplied locally by a shunt
# capacitor (models the capacitor banks that real distribution substations
# carry but OSM omits). 0 = off (default, keeps canonical comparability).
# Diagnosis (docs/reports/east_network_reactive_2026-07-09.md): east full AC
# non-convergence under honest demand geography is a reactive/voltage-collapse
# problem — DC angles are healthy, prune removes ~0 lines, yet AC diverges
# because ~19 GVar of load reactive demand must flow through high-X radial
# 66 kV lines with no local support. Compensation restores honest AC (98 %
# served, vs the fake 10.8 %). 0.6 is a reasonable central value.
#
# 2026-08-11 再較正 0.6 -> 0.8。**0.6 は太陽光の既定容量が 10MW（＝太陽光 180GW）
# だった頃に決めた値**で、介入#25 でそれを実測中央値 0.10MW へ正したときに合わなくなった。
# モデルの発電機は max_q_mvar = 0.5 × 容量 を持つ無効電力源でもあるので、
# 水増し太陽光を消すと**捏造されていた無効電力サポートも一緒に消える**
# （hokkaido の vm<0.80 が 8 → 45 バスへ悪化した。原因分解は
#  docs/reports/reactive_factor_recalibration_2026-08-11.md）。
# 0.8 は 4 島すべてで電圧・最大負荷率のどちらも悪化させない:
#   hokkaido vm<0.80 38->1 / okinawa 2->0 / east 0->0 / west 11->10
# ⚠ これは**捏造の付け替え**でもある（実在しない太陽光の q → 台帳に載るコンデンサ
#   バンク・4島計 +9,000 MVar 弱）。後者は数えられ・開示され・切れる分だけ誠実だが、
#   「電圧が持つように上げた」が独り歩きするとモデルが健全だという誤読を生む。
#   無効化は `--no-reactive-comp`、値の上書きは `--reactive-comp <FACTOR>`。
reactive_compensation_factor: 0.8

# Voltage-class weights for distributing demand across buses
# Lower voltage levels carry proportionally more distribution load
# Weights are normalized within each region
voltage_weights:
  500: 0.05
  275: 0.15
  220: 0.20
  187: 0.25
  154: 0.30
  132: 0.35
  110: 0.40
  77: 0.45
  66: 0.50
  0: 0.50    # Default/unknown voltage

# Generation scaling
# Target generation = total_demand * (1 + reserve_margin)
# ext_grid absorbs the residual mismatch
reserve_margin: 0.05
