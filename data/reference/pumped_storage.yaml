# 日本の揚水発電所 参照リスト（44件・現況出力合計 約27.6GW）
#
# 出典: エレクトリカル・ジャパン「日本全国の揚水発電所一覧」
#   https://agora.ex.nii.ac.jp/earthquake/201103-eastjapan/energy/electrical-japan/type/5.html.ja
#   （国立情報学研究所 北本朝展研究室、2026-06-11取得。現況出力ベース:
#     葛野川1200=4号機まで・神流川940=2号機まで運開を反映）
#
# 用途（src/uc/scenario.py apply_pumped_storage_reference）:
#   1) OSM hydro発電機への名前マッチで fuel_type=pumped_hydro に再分類+容量補正
#   2) OSMに存在しない揚水を参照値で追加
#
# region: 電気的帰属管内。10電力運営分は自明。J-POWER（電源開発）分は
#   系統連系先ベースで判断（note に所在地と根拠を開示）。
#
# storage_h: 満水からの全力発電可能時間。個別の上池容量(MWh)の一次公表は
#   乏しいため、純揚水の典型運転時間 6h を既定値とする（defaults.storage_h）。
#   個別に確かな値が得られたエントリのみ storage_h を上書きすること。

defaults:
  storage_h: 6
  charge_efficiency: 0.84    # 総合効率~70%を充放電に等分 (0.84^2 ≈ 0.70)
  discharge_efficiency: 0.84

plants:
