# OSM容量欠損の大規模火力に対する個別容量パッチ
#
# 背景（2026-06-11計測）: 容量欠損の coal/gas はユニーク18機で、ほぼ全てが
# 小規模自家発・産業用IPP（住友共同電力・製紙ミル・市クリーンセンター等）。
# 一律 THERMAL_DEFAULT（coal 600MW）の補完は約10倍の過大評価で、coal容量を
# 19.2GW 水増ししシェアを 39%（実態~28%）に歪めていた。
# 一方で実際に大規模なのに欠損している例外が以下の2件。
#
# 適用: 名前部分一致（src/uc/scenario.py ローダー、容量欠損時のみ）。
# 出典: 各社公表の設備諸元。

patches:
  - match: 苓北
    capacity_mw: 1400
    note: 九州電力 苓北火力 700MW×2（石炭）
  - match: 福島ガス発電所
    capacity_mw: 1180
    note: 福島天然ガス発電 590MW×2（LNG）
