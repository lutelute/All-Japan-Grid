[pytest]
; Collect only the real test suite. scripts/diagnostics/ contains standalone
; diagnostic scripts whose test_*.py names pytest would otherwise pick up
; (they are __main__ scripts with sys.argv handling, not test modules).
testpaths = tests
markers =
    slow: 週次だけ(AJGRID_SLOW_TESTS=1)
    legacy_lineage: 旧系譜(地域別のスナップ済みの網・build_and_solve・src/reconstruction)。比較用の記録
    canonical: 正典(docs/data/built/all.json と build_island_net)を全規模で解く
