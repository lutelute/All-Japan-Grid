<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全国の送電網が組み上がる — All-Japan-Grid</title>
<!-- 作り方: PYTHONPATH=. python scripts/build_desk_demos.py assembly(正本は scripts/templates/demo_grid_assembly.src.html) -->
<style>
:root{--bg:#0b1320;--card:rgba(12,21,35,.86);--fg:#e8eef6;--mut:#9fb0c4;--line:rgba(160,185,215,.2);--acc:#ffb547;--chip:#1a283e;--chipon:#ffb547;--chipfg:#0b1320}
:root[data-theme=light]{--bg:#eef2f6;--card:rgba(255,255,255,.93);--fg:#15202e;--mut:#4f6074;--line:rgba(30,50,80,.16);--acc:#c8650f;--chip:#e2e8ef;--chipon:#c8650f;--chipfg:#ffffff}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif}
#map{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
#panel{position:fixed;left:16px;top:16px;width:clamp(250px,27vw,360px);max-height:calc(100vh - 96px);overflow:auto;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px 14px;box-shadow:0 8px 30px rgba(0,0,0,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--mut);font-weight:600}
.tbtn{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:1px 10px;cursor:pointer}
h1{font-size:clamp(20px,2.2vw,27px);line-height:1.3;margin:6px 0 8px}
h2{font-size:15px;margin:2px 0 4px;color:var(--acc)}
#sbody{margin:0 0 8px}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.stat{background:rgba(127,140,160,.1);border-radius:10px;padding:5px 10px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{font-size:11px;color:var(--mut)}
.stat.wide{grid-column:1/3}
#legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin:6px 0 0}
.sw{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.sw.dash{background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 8px)!important;height:2px}
.dia{display:inline-block;width:7px;height:7px;transform:rotate(45deg);margin:0 7px 1px 4px;vertical-align:middle}
.caveat{font-size:11px;line-height:1.55;color:var(--mut);margin:10px 0 0;border-top:1px solid var(--line);padding-top:8px}
#panel.folded h1,#panel.folded #sbody,#panel.folded #legend,#panel.folded .caveat{display:none}
#bar{position:fixed;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:10px;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#play{width:34px;height:34px;border-radius:50%;border:0;background:var(--acc);color:var(--chipfg);font-size:13px;cursor:pointer;flex:none}
#chips{display:flex;gap:4px;flex:none}
.chip{font:inherit;font-size:12px;border:0;background:var(--chip);color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.chip .num{font-weight:700;margin-right:5px;opacity:.7}
.chip.on{background:var(--chipon);color:var(--chipfg)}
.chip.done{opacity:.72}
#time{flex:1;min-width:50px;accent-color:var(--acc)}
#tip{position:fixed;pointer-events:none;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;max-width:300px;z-index:5}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:1180px){.chip .lab{display:none}.chip .num{margin:0;opacity:1}}
@media (max-width:880px){#panel{left:10px;right:10px;width:auto;top:auto;bottom:62px;max-height:44vh}#bar{left:10px;right:10px;bottom:10px}}
@media (max-height:640px){h1{font-size:19px;margin:4px 0 6px}#panel{padding:10px 14px 12px}.stat b{font-size:16px}#sbody{font-size:13px;line-height:1.55}}
</style>
</head>
<body>
<canvas id="map" aria-label="全国の送電線が、電圧の高い順に組み上がっていく地図"></canvas>
<aside id="panel" aria-live="polite">
  <div class="top"><span class="eyebrow">ALL-JAPAN-GRID</span><span><button class="tbtn" id="themeb" type="button" title="配色を切り替える(T)">配色</button> <button class="tbtn" id="fold" type="button" title="説明を畳む・開く">説明</button></span></div>
  <h1 id="headline">誰も持たない電気の地図。</h1>
  <h2 id="stitle"></h2>
  <p id="sbody"></p>
  <div id="stats"></div>
  <div id="legend"></div>
  <p class="caveat" id="caveat"></p>
</aside>
<div id="bar"><button id="play" type="button" aria-label="再生">▶</button><div id="chips"></div><input id="time" type="range" min="0" step="1" value="0" aria-label="時刻"></div>
<div id="tip" hidden></div>
<script>
const D = /*__DATA__*/null;
/*__ENGINE__*/

const PAL = {
  dark: { bg: '#0b1320', land: '#13202f', coast: '#25394f', tier: ['#ffb547', '#4cc6ff', '#7be0a0', '#b79bff', '#ff7aa8'], isl: ['#7be0a0', '#6ea8ff', '#ff8f5a', '#d59cff'],
          dc: '#ffffff', fc: '#ff5fd2', ac: '#fff1b8', lab: 'rgba(232,238,246,.86)', halo: 'rgba(11,19,32,.85)', glow: true, spark: '#ffffff' },
  light: { bg: '#eef2f6', land: '#ffffff', coast: '#c3cfdc', tier: ['#d06a12', '#1d78c1', '#2f9e5e', '#7b52c4', '#c2185b'], isl: ['#2f9e5e', '#2d6cdf', '#e0632a', '#9b59c9'],
           dc: '#15202e', fc: '#c2189b', ac: '#8a5a00', lab: 'rgba(21,32,46,.88)', halo: 'rgba(255,255,255,.9)', glow: false, spark: '#15202e' },
};
let theme = themeOf(); applyTheme(theme); let C = PAL[theme];
setupPanel();

const OUT = D.outline.map(a => decode(a, 100));
const LINES = D.lines.map(l => { const P = decode(l.q, 1e4); return { ...l, P, C: cumlen(P) }; });
const ICS = D.ics.map(ic => ({ ...ic, parts: ic.q.map(a => { const P = decode(a, 1e4); return { P, C: cumlen(P) }; }) }));
const CONV = D.conv.map(c => ({ ...c, x: c.lon, y: MERC(c.lat) }));
const LABS = D.labels.map(l => ({ ...l, x: l.lon, y: MERC(l.lat) }));
const ISL_LABS = D.islands.map((name, k) => {
  const ls = LABS.filter(l => D.island_of[l.r] === k); if (!ls.length) return null;
  return { name, k, x: ls.reduce((s, l) => s + l.x, 0) / ls.length, y: ls.reduce((s, l) => s + l.y, 0) / ls.length };
}).filter(Boolean);
const BOX = [129.3, 30.8, 146.1, 45.6];
const M = D.made, S = D.stat, T = S.tiers, NT = T.length;
// 段 g の線が伸びる場面は 1 + g(0 は日本の形)。そのあと連系線・50/60 Hz・正典
const SC_TIES = NT + 1, SC_FREQ = NT + 2, SC_CANON = NT + 3;
const kvs = g => T[g].kv.filter(v => v > 0).join('・');

const SCENES = [
  { id: 'japan', label: '日本の形', dur: 3.5 },
  { id: 't500', label: '500 kV の背骨', dur: 8 },
  { id: 'trunk', label: '各社の基幹', dur: 8 },
  { id: 'region', label: '地域の網', dur: 7 },
  { id: 'local', label: '変電所へ', dur: 7 },
  { id: 'osm_low', label: '22・33 kV', dur: 5 },
  { id: 'ties', label: '連系線', dur: 6 },
  { id: 'freq', label: '50 Hz と 60 Hz', dur: 5 },
  { id: 'canon', label: '正典', dur: 3 },
];
const tierKm = g => `${fmt(T[g].n)} 本・${fmt(T[g].km)} km`;
const TEXT = [
  { t: '日本の形', b: '日本の送電網は 10 の会社がそれぞれ持っていて、全国を 1 枚にした公開の地図はありません。All-Japan-Grid は、OpenStreetMap(OSM)に描かれた送電線と変電所から、全国の網を組み立てます。' },
  { t: '500 kV の背骨', b: `いちばん電圧の高い 500 kV の線を、つながった網ごとに枝のいちばん多い点から、道のりの順に伸ばします。北海道には 500 kV がありません。${tierKm(0)}。` },
  { t: '各社の基幹(275・220・187 kV)', b: `500 kV のすぐ下の基幹の電圧は、会社で違います。東北・東京・中部・北陸・関西は 275 kV、中国と九州は主に 220 kV、四国は 187 kV、北海道は 275 kV と 187 kV です。500 kV の網から外へ伸ばします。${tierKm(1)}。` },
  { t: '地域の網(154・110 kV)', b: `その下で地域を回る網です。東北・東京・中部・北陸・関西は 154 kV、中国は 110 kV です。九州・四国・北海道にも 110 kV がありますが、その下の 66 kV のほうが多くあります。${tierKm(2)}。` },
  { t: '変電所へ(77・66 kV)', b: `配電用の変電所へつなぐ網です。中部と関西は 77 kV、北陸は 77 kV と 66 kV、ほかは 66 kV です。電圧の書いていない線(潮流の計算では 66 kV として扱う)もここに入れています。${tierKm(3)}。` },
  { t: '22・33 kV(OSM)', b: `OSM には 66 kV より低い 22 kV・33 kV の線もあり、北海道・東北(佐渡を含む)・関西に多くあります。正典(潮流の計算のモデル)には 66 kV より低い級が無く、取り込むときは 66 kV に丸めるので、この場面だけは OSM の線をそのまま描きます(鉄道の線は外しています)。${tierKm(4)}。` },
  { t: '10 社の網がつながる', b: '地域どうしは連系線でつながります。北海道と本州は直流、東京と中部は周波数変換所、関西と四国は直流で、そのほかは 500 kV の交流の線です。線や印にふれると名前が出ます。' },
  { t: '50 Hz と 60 Hz', b: '東は 50 Hz、西は 60 Hz です。東と西は周波数変換所だけでつながり、北海道と本州は直流だけでつながります。潮流の計算では、同じ周波数で同期している系統を 1 つの島として解きます。' },
  { t: '正典', b: `全電圧の正典(潮流の計算に使うモデル)は ${fmt(M.nodes)} 点・${fmt(M.edges)} 枝です。OSM の線 ${fmt(M.osm_lines)} 本から作り、公表の資料で確かめ、加えた仮定は介入台帳に ${M.interventions} 件書いてあります。` },
];
document.getElementById('caveat').textContent =
  `線の形は OSM、つなぎ方は正典(OSM から作ったモデル、版 ${M.model_version})で、電力会社の系統図そのものではありません。` +
  '平行する回線は 1 本に数え、km は線の道のりです。22・33 kV の線だけは OSM そのもので、正典ではありません。沖縄は本州から離れているので、この絵には入れていません。' +
  '線と変電所 © OpenStreetMap の協力者(ODbL)。県の形は国土地理院のデータを簡略化したもの。';

let dirty = true, st = null, lastScene = -1;
const view = new View(document.getElementById('map'), () => { dirty = true; });
function pads() {
  const p = document.getElementById('panel').getBoundingClientRect(), b = document.getElementById('bar').getBoundingClientRect();
  if (window.innerWidth <= 880) return [16, 16, 16, window.innerHeight - p.top + 12];
  return [p.right + 16, 16, 16, window.innerHeight - b.top + 14];
}
view.fit(BOX, pads());

const player = new Player(SCENES, () => { dirty = true; });
function state() {
  const i = player.scene(), u = player.local();
  return {
    i, u,
    land: i === 0 ? ease(u) : 1,
    p: T.map((_, g) => i < g + 1 ? 0 : i === g + 1 ? clamp(u * 1.05, 0, 1) : 1),
    pic: i < SC_TIES ? 0 : i === SC_TIES ? clamp(u * 1.4, 0, 1) : 1,
    labs: i < SC_TIES ? 0 : i === SC_TIES ? clamp(u * 2, 0, 1) : 1,
    isl: i < SC_FREQ ? 0 : i === SC_FREQ ? ease(clamp(u * 1.6, 0, 1)) : 1,
    canon: i < SC_CANON ? 0 : ease(u),
  };
}
const frac = (l, p) => p <= l.t0 ? 0 : p >= l.t1 ? 1 : (l.t1 > l.t0 ? (p - l.t0) / (l.t1 - l.t0) : 1);
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, j) => Math.round(v + (B[j] - v) * t)).join(',')})`; }

function setScene(i) {
  const tx = TEXT[i];
  document.getElementById('stitle').textContent = `${i + 1}. ${tx.t}`;
  document.getElementById('sbody').textContent = tx.b;
  const lg = document.getElementById('legend');
  if (i < SC_FREQ) lg.innerHTML = T.map((t, g) => g + 1 <= Math.max(i, 1) ? `<span><i class="sw" style="background:${C.tier[g]}"></i>${t.label}</span>` : '').join('') +
    (i >= SC_TIES ? `<span style="color:${C.dc}"><i class="sw dash"></i><span style="color:var(--mut)">直流</span></span><span><i class="dia" style="background:${C.fc}"></i>周波数変換・変換所</span>` : '');
  else lg.innerHTML = D.islands.slice(0, 3).map((n, k) => `<span><i class="sw" style="background:${C.isl[k]}"></i>${n}</span>`).join('') +
    `<span><i class="dia" style="background:${C.fc}"></i>周波数変換・変換所</span>`;
}
function setStats(s) {
  const km = T.map(() => 0);
  for (const l of LINES) km[l.g] += l.km * frac(l, s.p[l.g]);
  const el = document.getElementById('stats');
  let h = '';
  T.forEach((t, g) => { if (g + 1 <= Math.max(s.i, 1) && s.i < SC_TIES) h += `<div class="stat"><b>${fmt(km[g])}</b><span>${t.label.split('(電圧不明')[0]} の km</span></div>`; });
  if (s.i >= SC_TIES) h += `<div class="stat"><b>${fmt(km.reduce((a, b) => a + b, 0))}</b><span>線の km(全部の段)</span></div><div class="stat"><b>${D.ics.length}</b><span>連系の線・設備</span></div>`;
  if (s.i >= SC_CANON) h += `<div class="stat wide"><b>${fmt(M.nodes * s.canon)} 点・${fmt(M.edges * s.canon)} 枝</b><span>正典の全電圧(介入台帳 ${M.interventions} 件)</span></div>`;
  el.innerHTML = h;
}

function strokeGroup(g, list, color, w, glow, alpha = .95) {
  if (!list.length) return [];
  const heads = [];
  g.beginPath();
  for (const [l, f] of list) { const h = view.path(g, l.P, l.C, f); if (f < 1 && h) heads.push(h); }
  if (glow && C.glow) { g.globalAlpha = .16 * alpha; g.lineWidth = w * 4; g.strokeStyle = color; g.stroke(); }
  g.globalAlpha = alpha; g.lineWidth = w; g.strokeStyle = color; g.stroke(); g.globalAlpha = 1;
  return heads;
}
function draw(now) {
  const s = st = state();
  if (s.i !== lastScene) { lastScene = s.i; setScene(s.i); }
  setStats(s);
  const g = view.begin(C.bg);
  g.lineJoin = 'round'; g.lineCap = 'round';
  // 陸
  g.globalAlpha = s.land; g.beginPath(); for (const P of OUT) view.ring(g, P);
  g.fillStyle = C.land; g.fill(); g.lineWidth = 1; g.strokeStyle = C.coast; g.stroke(); g.globalAlpha = 1;
  // 線(電圧と地域ごとにまとめて描く)
  const w5 = clamp(1.7 * Math.sqrt(view.k / 45), 1.3, 4.2);
  // 段ごとの太さ(下の段ほど細い)。22・33 kV(OSM)の場面では、ほかの段を薄くして OSM の線を太く見せる
  const low = s.i === NT ? ease(clamp(s.u * 3, 0, 1)) : 0;
  const WT = [w5, w5 * .58, w5 * .42, w5 * .32, w5 * (.45 + .35 * low)];
  const groups = new Map();
  for (const l of LINES) {
    const f = frac(l, s.p[l.g]); if (f <= 0) continue;
    const key = l.g * 100 + l.r; if (!groups.has(key)) groups.set(key, []); groups.get(key).push([l, f]);
  }
  if (C.glow) g.globalCompositeOperation = 'lighter';
  const heads = [];
  for (let gg = NT - 1; gg >= 0; gg--) for (let r = 0; r < D.regions.length; r++) {   // 下の段から描いて、上の段を上に重ねる
    const list = groups.get(gg * 100 + r); if (!list) continue;
    const base = C.tier[gg], col = s.isl > 0 ? mix(base, C.isl[D.island_of[r]], s.isl) : base;
    heads.push(...strokeGroup(g, list, col, WT[gg], gg <= 1 || (gg === NT - 1 && low > 0), gg === NT - 1 ? .95 : .95 - .6 * low));
  }
  g.globalCompositeOperation = 'source-over';
  // 伸びている先の光
  g.fillStyle = C.spark;
  for (const [x, y] of heads) { g.globalAlpha = .9; g.beginPath(); g.arc(x, y, 2.2, 0, 7); g.fill(); }
  g.globalAlpha = 1;
  // 連系線
  if (s.pic > 0) {
    ICS.forEach((ic, j) => {
      const f = clamp(s.pic * 1.25 - j * .015, 0, 1); if (f <= 0) return;
      const dc = ic.k === '直流', fc = /周波数|BTB/.test(ic.k);
      g.beginPath(); for (const p of ic.parts) view.path(g, p.P, p.C, f);
      if (C.glow) { g.globalAlpha = .25; g.lineWidth = w5 * 4.5; g.strokeStyle = dc ? C.dc : fc ? C.fc : C.ac; g.stroke(); }
      g.globalAlpha = 1; g.setLineDash(dc ? [7, 5] : []); g.lineWidth = dc ? w5 * .9 : w5 * 1.25; g.strokeStyle = dc ? C.dc : fc ? C.fc : C.ac; g.stroke(); g.setLineDash([]);
    });
    const pulse = s.i === SC_TIES || s.i === SC_FREQ ? (Math.sin(now / 260) + 1) / 2 : 0;
    for (const c of CONV) {
      const a = clamp((s.pic - .25) * 3, 0, 1); if (a <= 0) continue;
      const x = view.sx(c.x), y = view.sy(c.y), r = 4.5 + w5 * .6, fc = /周波数|BTB/.test(c.k);
      g.globalAlpha = a;
      if (pulse) { g.beginPath(); g.arc(x, y, r + 3 + pulse * 6, 0, 7); g.strokeStyle = fc ? C.fc : C.dc; g.lineWidth = 1; g.globalAlpha = a * (1 - pulse) * .8; g.stroke(); g.globalAlpha = a; }
      g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath();
      g.fillStyle = fc ? C.fc : C.dc; g.fill(); g.lineWidth = 1.2; g.strokeStyle = C.bg; g.stroke();
    }
    g.globalAlpha = 1;
  }
  // 地域の名前・島の名前
  const fs = clamp(11 + view.k / 30, 11, 15);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (s.labs > 0 && s.isl < 1) {
    g.font = `600 ${fs}px -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif`; g.globalAlpha = s.labs * (1 - s.isl);
    for (const l of LABS) { const x = view.sx(l.x), y = view.sy(l.y); g.lineWidth = 4; g.strokeStyle = C.halo; g.strokeText(l.ja, x, y); g.fillStyle = C.lab; g.fillText(l.ja, x, y); }
  }
  if (s.isl > 0) {
    g.font = `700 ${fs + 5}px -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif`; g.globalAlpha = s.isl;
    for (const l of ISL_LABS) { const x = view.sx(l.x), y = view.sy(l.y); g.lineWidth = 5; g.strokeStyle = C.halo; g.strokeText(l.name, x, y); g.fillStyle = C.isl[l.k]; g.fillText(l.name, x, y); }
  }
  g.globalAlpha = 1;
}

// ふれると名前
const tip = document.getElementById('tip');
document.getElementById('map').addEventListener('pointermove', e => {
  if (e.buttons || !st) { tip.hidden = true; return; }
  const px = e.clientX, py = e.clientY; let best = null, bd = 8;
  if (st.pic > 0) {
    for (const c of CONV) { const d = Math.hypot(view.sx(c.x) - px, view.sy(c.y) - py); if (d < bd + 2) { bd = d - 2; best = `${c.n}(${c.k})`; } }
    for (const ic of ICS) for (const p of ic.parts) { const d = view.dist(p.P, px, py); if (d < bd) { bd = d; best = `${ic.n}(連系・${ic.k})`; } }
  }
  if (!best) for (const l of LINES) {
    if (frac(l, st.p[l.g]) <= 0) continue;
    const d = view.dist(l.P, px, py);
    if (d < bd) { bd = d; best = `${l.n || '名前なし'} — ${l.v ? l.v + ' kV' : '電圧不明'}・${D.regions[l.r]}・${l.km} km${l.g === NT - 1 ? '(OSM)' : ''}`; }
  }
  if (best) { tip.textContent = best; tip.hidden = false; tip.style.left = Math.min(px + 14, window.innerWidth - 310) + 'px'; tip.style.top = (py + 14) + 'px'; }
  else tip.hidden = true;
});
document.getElementById('map').addEventListener('pointerleave', () => { tip.hidden = true; });

function setTheme(t) { theme = t; applyTheme(t); C = PAL[t]; lastScene = -1; dirty = true; }
document.getElementById('themeb').addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark'));
window.addEventListener('keydown', e => {
  if (e.key === 't' || e.key === 'T') setTheme(theme === 'dark' ? 'light' : 'dark');
  if (e.key === '0') { view.user = false; view.flyTo(BOX, pads(), 600); }
});
document.getElementById('fold').addEventListener('click', () => { if (!view.user) setTimeout(() => view.flyTo(BOX, pads(), 400), 30); });
window.addEventListener('resize', () => { if (!view.user) view.fit(BOX, pads()); });

function loop(now) {
  const a = player.tick(now), b = view.step(now);
  const live = st && st.pic > 0 && (st.i === SC_TIES || st.i === SC_FREQ);
  if (a || b || dirty || live) { draw(now); dirty = false; }
  requestAnimationFrame(loop);
}
// ?scene=N(1 から)で、その場面から。?autoplay=0 なら、その場面の終わりの絵で止める
const q = new URLSearchParams(location.search);
const sc = clamp((Number(q.get('scene')) || 1) - 1, 0, SCENES.length - 1);
if (q.get('autoplay') === '0') player.seek(player.starts[sc] + SCENES[sc].dur - 1e-3);
else { player.seek(player.starts[sc]); player.play(); }
requestAnimationFrame(loop);
</script>
</body>
