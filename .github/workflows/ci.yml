# CI: the 940+ test suite on every push/PR — the regression pins
# (topology KPIs, power-flow physics, validators) now gate merges
# instead of relying on a local pytest habit.
#
# The slow 10-region solved sweep stays opt-in (AJGRID_SLOW_TESTS=1,
# several minutes) and is exercised by the weekly scheduled run.
#
# 2026-10-21: 週次の sweep は旧系譜(地域別のスナップ済みの網)の記録に直し、正典の 4 島を全規模の
# AC で解くジョブ canonical-islands を足した。それまで週次は 06-14 の初回から 19 回すべて赤で、
# 正典を解く週次テストは無かった(docs/reports/project_structure_2026-10-21.md の A7)。
# 記録を更新したあと手で回せるように workflow_dispatch を付けた。
name: tests

on:
  push:
    branches: [main]
    # でんき予報の自動commitは毎時 main に入るが、触るのは表示用スナップショット
    # だけでモデルには効かない。ここだけを除外して通知の洪水を止める。
    # data/*.geojson や docs/data/built などモデルの正典は**除外しない** —
    # 2026-08-16 の基底刷新のように、劣化はデータ側から入ってくる。
    paths-ignore:
      - "docs/data/realtime/**"
      - "docs/data/flow_map/**"
  pull_request:
  schedule:
    - cron: "0 21 * * 0"   # weekly (Mon 06:00 JST): includes the slow sweep
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fast suite (regression pins)
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: python -m pytest -q
      # README の数字(規模・介入件数・版)はデータから cog で生成している。モデルを作り直して
      # 数字が変わったのに README を書き直していなければ落ちる → `cog -I . -r README.md` で直す
      - name: README numbers match the data
        run: python -m cogapp -I . --check README.md
      - name: Full suite incl. 旧系譜の記録 sweep (weekly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          AJGRID_SLOW_TESTS: "1"
        # 正典の 4 島は別ジョブ(canonical-islands)で並べて回す
        run: python -m pytest -q -m "not canonical" -rf

  # clone しただけ(git の外のデータなし)で正典を作り直し、コミットしてある正典とバイト一致するか(2026-10-24)。
  # 構造 DB は手順の中で基底の OSM から作り、#44 の回線数は追跡している台帳から当てる。
  # 正典を変えるコードを直したのに正典を作り直していなければ、ここで落ちる
  # → `PYTHONPATH=. python scripts/regenerate_all.py` で作り直してコミットする(docs/REPRODUCIBILITY.md)
  reproduce-canon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: clone だけから正典を作り直す
        env:
          PYTHONPATH: .
        run: python scripts/regenerate_all.py --light
      # 正典だけでなく、--light で作る追跡ファイルの全部(地図・SubSLD・単線結線図・変電所の属性・台帳)。
      # 違ってよいのは、実行の記録(MODEL_VERSION)と、#44 の報告(台帳から作ったと書く)だけ
      - name: 作り直した正典と出力がコミットと一致する
        run: |
          git status --short
          git diff --stat --exit-code -- . ':!docs/data/MODEL_VERSION.json' ':!docs/reports/circuit_sources_*'
          git diff --quiet -- docs/data/built/all.json && echo "正典 docs/data/built/all.json はコミットとバイト一致"
      # 落ちたときは、作り直した側のファイルとライブラリの版を残す(手元で比べる)
      - name: 違いを残す(落ちたとき)
        if: failure()
        run: |
          mkdir -p _repro_diff
          git diff --name-only | xargs -I{} cp --parents {} _repro_diff/
          pip freeze > _repro_diff/pip_freeze.txt
          python -VV > _repro_diff/python_version.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reproduce-canon-diff
          path: _repro_diff
          retention-days: 7

  # 正典の 4 つの同期島を全規模で AC 潮流に解く(配布ケースと同じ網・同じ素朴な NR)
  canonical-islands:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # 変圧器の銘板の容量は構造 DB(git の外)から読む。配布ケースと同じ網にするため先に作る(約 5 秒・2026-10-25)
      - name: 構造 DB を作る
        env:
          PYTHONPATH: .
        run: python scripts/build_structures_batch.py --all
      - name: 正典 4 島の全規模 AC
        env:
          AJGRID_SLOW_TESTS: "1"
        run: python -m pytest -q -m canonical -rA --durations=0
