name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/server/geojson_loader.py'
      - 'config/**'
      - 'docs/**'
      - 'scripts/build_static_site.py'
      # 全面改修Phase4: builder/連結性/編集ビュー生成が変わったら再デプロイ(鮮度統一)
      - 'src/powerflow/snapped_topology.py'
      - 'src/powerflow/connectivity.py'
      - 'src/server/built_view.py'
      - 'scripts/build_editor_data.py'
      - 'scripts/regenerate_all.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/build_static_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
