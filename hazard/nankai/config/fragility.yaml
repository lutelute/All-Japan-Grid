        - {jma_class: "5強", p_outage: 0.05}
        - {jma_class: "6弱", p_outage: 0.10}
        - {jma_class: "6強", p_outage: 0.25}
        - {jma_class: "7",   p_outage: 0.30}
      confidence: low
      note: "仮定 (熊本の粗い率を丸めた)。感度ケース用。既定は内閣府に合わせ停止しない。"

  pumped_storage:
    same_as: hydro
    note: >
      内閣府/経産省は揚水を停止しない前提 (夜間需要が供給力を下回った時点で揚水供給力 100% を加算, 経産省 2015 p.3)。
      3.11 で東京電力 八汐・沼原ダムの遮水壁亀裂 (土木学会 報告書 §2.3) があり、大規模揚水のダム損傷は将来版で検討。

  solar_wind_geothermal:
    im: jma_intensity
    default_policy:
      rule: "火力の japan_stop_rate_by_jma_intensity と同じ停止率を適用"
      confidence: medium
      source: "内閣府 2025 手法概要 p.42 「新エネルギー (風力、太陽光、地熱): 過去災害における被害状況から定量評価手法を確立することは難しいが…火力発電全体の被害率と同等の被害を生じるものと仮定」"
    observations:
      - "熊本 2016: 住宅用 PV のパネル脱落・変形の報告あり (日経xTECH 等)、事業用の被害率は未公表 (low)"
      - "能登 2024: 石川県内 2 箇所の風力でブレード破損・落下 (名古屋大 丸山研 Q&A; low)"
      - "HAZUS に太陽光/風力の損傷関数は無い"
    optional_lognormal:
      enabled: false
      im: pga
      functional_outage: {median_g: 0.6, beta: 0.6}
      confidence: low
      note: "仮定。感度ケース用のみ。"

# -----------------------------------------------------------------------------
# 4. 津波: 変電所の浸水深別 機能喪失確率
# -----------------------------------------------------------------------------
tsunami_substations:
  im: inundation_depth
  confidence: low
  table:
    - {depth_m_min: 0.0, depth_m_max: 0.3, p_functional_failure: 0.05, expected_state: slight}
    - {depth_m_min: 0.3, depth_m_max: 1.0, p_functional_failure: 0.50, expected_state: extensive}
    - {depth_m_min: 1.0, depth_m_max: 2.0, p_functional_failure: 0.85, expected_state: complete}
    - {depth_m_min: 2.0, depth_m_max: 99.0, p_functional_failure: 0.98, expected_state: complete}
  source: >
    仮定。アンカー: (1) 東北電力 変電所被害 75 箇所のうち津波 9 箇所 (主要変圧器 23/90, 遮断器 171/177,
    断路器 331/403 が津波起因) [経産省提供資料 参考資料2 p.7]; 南三陸町の変電所は「屋外機器壊滅・流失、
    建屋流失 (基礎残置)」(同 p.27)。(2) 土木学会 報告書 §2.4 p.32「沿岸部の変電所では構内への浸水により
    設備が使用不可能となる被害、周辺構造物のがれきや車両の流入等による機器の損壊、設備の流出」。
    (3) 火力の内閣府表は浸水深 0.3 m 以上で 100% 停止 (制御盤・電源の浸水)。変電所も制御・保護盤と所内電源が
    地上階にあり同様と考えた。(4) 国交省の津波建物被害調査: 浸水深 2 m 超で RC/S 造でも損壊率が高い。
  note: >
    「津波被災変電所 14 箇所」等の公表値は本作業で確認できなかった (東北電力 9 箇所のみ確認)。
    浸水域内の変電所総数 (分母) が無いので確率は置いた値。GIS 変電所 (屋内) は屋外変電所より
    浸水に強い可能性があるが区別しない。地震動と津波の複合は max(P_shaking_complete, P_tsunami) ではなく
    1-(1-P_s)(1-P_t) で合成する。

