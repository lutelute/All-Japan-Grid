# 周波数・保護リレー・系統分離の動的シミュレーション(dynamics.py / dyn_cascade.py)。
# kind: sourced = 一次資料の値 / assumption = 本モデルの仮定(感度で確かめる対象)
# 周波数しきい値は「基準周波数に対する比」で持ち、50 Hz / 60 Hz に同じ比で当てる(北海道 2018 の 50 Hz 実値を 60 Hz に比で移す仮定)。
schema: nankai-dynamics-v0

integration:
  dt_active_s: 0.02          # 周波数が動いている間の刻み
  dt_calm_s: 0.2
  calm_rocof_hz_s: 0.01      # |df/dt| がこれ未満でタイマーも止まっていれば「静穏」→ 次の事象まで飛ぶ
  t_end_s: 10800             # 3 時間(津波の到達まで含める)
  dt_active_bus_s: 0.05      # 母線単位のカスケードでの刻み
  settle_after_event_s: 120  # 事象から 120 秒積分したら次の事象まで飛ぶ(UFLS 遅延 ≤21 秒・発電機保護 ≤30 秒より十分長い)
  dt_slow_s: 0.2             # 600 秒以降(津波の段階)の刻み
  settle_slow_s: 60

inertia:                     # 慣性定数 H [s](機器容量基準)。容量 S = pmax / pf
  kind: assumption
  note: "Kundur(1994)Table 3.2 の典型範囲(火力 2.5〜9 s・水力 2〜4 s)の中央付近を置いた"
  H_s: {thermal: 5.0, nuclear: 5.0, hydro: 3.0, geothermal: 3.0, unknown: 4.0, slack: 4.0, solar: 0.0, wind: 0.0}
  power_factor: 0.9

load:
  damping_pct_per_hz: {kind: assumption, value: 2.0, note: "負荷の周波数特性 2%/Hz(TECHNICAL_NOTE の例と同じ)"}
  quake_demand_drop_ramp_s: {kind: assumption, value: 60.0, note: "demand_reduction(震度別)を S 波到達から 60 秒で効かせる(機器停止・電圧低下による脱落の代理)"}

governor:                    # 一次調整(ガバナフリー)。上げ代 = min(pmax − p0, share × pmax)
  kind: assumption
  droop: 0.05
  T_s: {thermal: 6.0, hydro: 10.0, geothermal: 6.0, unknown: 6.0, slack: 6.0}
  up_share: {thermal: 0.05, hydro: 0.10, geothermal: 0.03, unknown: 0.03, slack: 0.05, nuclear: 0.0, solar: 0.0, wind: 0.0}
  down_share: 0.10

ufls:                        # 周波数低下リレーによる負荷遮断(UFR)。段ごとに (しきい値比, 遅延の範囲[s], 遮断率)
  kind: assumption
  source_anchor: "北海道 2018: 48.5 Hz 時限 0.1〜21 秒、48.0 Hz 時限 0.1〜6 秒(OCCTO 検証委員会 最終報告 本文 事象3)。本州各社の整定と遮断量は非公表のため、比を移し遮断量は仮定"
  stages:
    - {ratio: 0.970, delay_s: [0.1, 21.0], shed_frac: 0.15, n_relays: 8, spacing: log}    # 50 Hz → 48.5 Hz / 60 Hz → 58.2 Hz
    - {ratio: 0.960, delay_s: [0.1, 6.0], shed_frac: 0.15, n_relays: 6, spacing: log}     # 50 Hz → 48.0 Hz / 60 Hz → 57.6 Hz
  spacing_note: "時限は対数間隔(短い時限が多い)。等間隔は北海道 2018 のヒンドキャストで否定(最初の 2 秒でほとんど効かず全停)。2026-09-14 まで南海トラフの MC は等間隔のまま回していた(run_v2_dyn・run_v3_red は旧設定)"
  restore_after_min: {kind: assumption, value: 60.0, note: "(旧・2026-09-16 まで未実装だった)島が崩壊しなければ UFLS 遮断分は 1 時間で再送電。下の restore に置き換え"}
  restore:                   # UFLS で切った負荷の再送電(2026-09-16 実装・run_v8 から)。条件つき・段階的で、戻せない母線がある
    kind: assumption
    enabled: true
    after_s: 3600            # 切ってから最短でこの時間は戻さない(点検・指令)
    step_s: 300              # 判定の間隔。1 回に戻す量は下の block_mw と上げ代で決まる
    block_mw: 100            # 1 回(5 分)にエリアごとに戻す上限 → 1.2 GW/時。2022 福島県沖: 東京エリアの UFR 遮断 約 210 万戸(約 2.9 GW)が 23:36 の地震から 3 時間 16 分(3/17 2:52)で復電 = 平均 約 0.9 GW/時
    f_tol_hz: 0.2            # 島の周波数偏差がこれ以下なら戻す
    headroom_margin: 0.8     # 戻す負荷の合計は島の上げ代(運転中の同期機の pmax − 現出力)の 8 割まで
    not_restorable_tsunami_rank_min: 1   # 浸水想定域(A40 ランク 1 以上)の母線は戻さない(浸水した配電設備は点検・修理が要る)
    reset_relays: true       # 戻した母線の UFLS 段は再び動く
    source: "資源エネルギー庁 第46回 電力・ガス基本政策小委員会 資料3-1(2022 福島県沖: UFR で東京エリア最大約 210 万戸)/ 東京電力パワーグリッド 3/17 2:52 復電。段階復電の手順は各社の非公表の運用で、量と条件は仮定"
    disable: "--set ufls.restore.enabled=false で run_v7 以前と同じ(3 時間戻さない)"

generator_protection:        # 周波数による発電機の解列(比)
  under:
    hydro: {ratio: 0.920, delay_s: 0.5, kind: sourced, source: "OCCTO 北海道検証 最終報告 本文 事象6「水力発電所の多くは 46.0Hz でリレーが動作」"}
    thermal: {ratio: 0.940, delay_s: 30.0, kind: assumption, note: "過励磁(V/Hz)保護の代理。北海道 2018 のヒンドキャスト: 47.0 Hz・2 秒は 1 回目で全停になり否定、46.0 Hz・5 秒も最終段を再現できない。47.0 Hz・30 秒は 1 回目(47 Hz 未満は数秒)の運転継続と矛盾しないが、最終段の全停はどの設定でも再現できていない(残 UFR 約 100 MW の差で分かれる)"}
    nuclear: {ratio: 0.940, delay_s: 30.0, kind: assumption, note: "火力と同じと仮定"}
    geothermal: {ratio: 0.940, delay_s: 30.0, kind: assumption}
    unknown: {ratio: 0.940, delay_s: 30.0, kind: assumption}
    solar: {ratio: 0.950, delay_s: 0.2, kind: assumption, note: "FRT 要件の下限を 47.5 Hz 相当と仮定"}
    wind: {ratio: 0.950, delay_s: 0.2, kind: assumption, note: "北海道 2018 は周波数低下で風力 17 万 kW 停止(事象4)"}
  over:
    hydro: {ratio: 1.040, delay_s: 1.0, kind: sourced, source: "OCCTO 北海道検証 事象5: 道東の単独系統で周波数上昇(52.0 Hz 超)、水力が OFR で停止"}
    thermal: {ratio: 1.050, delay_s: 2.0, kind: assumption}
    default: {ratio: 1.050, delay_s: 2.0, kind: assumption}

collapse:
  kind: assumption
  f_min_ratio: 0.900         # これを割った島は全停(発電機が維持できない)
  f_max_ratio: 1.100
  min_inertia_mws: 50.0
  min_system_H_s: 0.5        # 島の慣性 E/負荷 が 0.5 秒未満(同期機がほぼ無い)なら、負荷があれば崩壊

emergency_support:           # 直流の緊急融通(AFC / EPPS)
  trigger_ratio: {kind: sourced, value: 0.9924, source: "OCCTO 北海道検証 事象2: 北本 AFC が 49.62 Hz で動作"}
  ramp_mw_s: {kind: assumption, value: 20.0, note: "北海道 2018 は 7→57 万 kW に「徐々に」増加(事象8)。速さは仮定"}
  afc_gain_mw_per_hz_s: {kind: assumption, value: 200.0, note: "一度動作した AFC は周波数偏差を積分して融通量を動かす(北海道 2018 は北本 AFC で 50 Hz に一時バランス、事象8)"}
  links:
    hokuhon_to_tohoku: {to_zone: tohoku, cap_mw: 900, kind: sourced, source: "data/reference/interconnections.yaml ic_001(OCCTO 運用容量 max 900)", note: "北海道は解析外で健全と仮定"}
    fc_east_west: {zones: [tokyo, chubu], cap_mw: 2100, kind: sourced, source: "data/reference/interconnections.yaml ic_003(東京中部間連系設備)", note: "周波数の低い側へ流す"}

relays:
  protection_clear_s: {kind: assumption, value: 0.2, note: "損傷した変電所・線路を保護が切り離すまで"}
  gen_seismic_trip_s: {kind: assumption, value: 2.0, note: "タービン振動検知などで停止するまで(北海道 2018 は振動検知で自動停止)"}
  nuclear_scram_s: {kind: assumption, value: 1.0}
  overload_check_delay_s: {kind: assumption, value: 5.0, note: "事象から潮流を再評価して過負荷リレー(1.25 倍)で切るまで"}
  max_overload_rounds: 12
  overload_enabled: true
  overload_min_kv: 0          # 感度: 275 にすると 275 kV 以上だけ過負荷で切る(東の下位網に 5 GW 級の非物理的な潮流が出るため)

network:
  kind: assumption
  model: reduced             # mesh = 正典のまま全開閉器を閉じた網 / reduced = ローカル系統(154 kV 以下)を常時開路・主幹系統だけで潮流(radial.py)
  local_max_kv: 154
  source: "北陸電力送配電 設備形成ルール(特高編)「77kV 以下の送電系統は原則として放射状運用」「154kV 送電系統は原則として放射状運用」/ 九州電力 系統運用ルール 7.2「ローカル系統(上記以外の 220kV 及び 110kV 以下系統)は放射状系統を基本」"
switching:
  tie_close_after_s: {kind: assumption, value: 1800.0, note: "電源を失ったローカル区間を常時開路点の投入で隣の区間から送るまで(遠隔・現地操作を含め 30 分と仮定)"}

tsunami_timing:
  source: "output/arrival_cache/tsunami.npz の √(gh) 走時(arrival_physics.py)。陸上は 0.6 km/分で奥へ"
  inland_km_per_min: 0.6

record_times_s: [0, 1, 5, 10, 20, 30, 60, 90, 120, 180, 300, 600, 1800, 3600, 7200, 10800]

grid_overrides:
  tepco_transformer_capacity:
    kind: sourced
    enabled: true
    db: data/external/hazard_support/hazard_support.sqlite   # git 管理外。環境変数 HAZARD_SUPPORT_DB で差し替え
    scale_impedance: true
    zones: [tokyo, chubu]      # tokyo = 東 50 Hz、chubu = 西 60 Hz(中部電力の 500/275 kV 変電所表)
    source: "東京電力パワーグリッド 空容量一覧(基幹系統・都県別 変電所 CSV)と中部電力パワーグリッド 空容量一覧(500/275 kV 変電所・単位 MW)の「台数」と「設備容量(100%×台数)」"
    rationale: "東 50 Hz の 500/275 kV 変圧器が多くの変電所で 1 バンク分(約 953 MW)しかなく、台帳と照合できた 21 変電所で合計 18.7 GW 対 74.0 GW(比の中央値 0.27)。run_v4_red の東で最初に切れていたのがこの変圧器だった。中部も照合 8 変電所でモデル 8.6 GW 対 台帳 23.1 GW(比の中央値 0.33)で同じ欠け(2026-09-14 追加・run_v7)"
    ledger: "output/<run>/east/grid_override_ledger.csv(台帳の生値を含むので git に載せない)。集計は docs/reports/nankai_hazard_2026-09-13/dynamics/README.md"
    disable: "--set grid_overrides.tepco_transformer_capacity.enabled=false(台帳が無い環境では止まるので、HAZARD_SUPPORT_DB を指すか無効にする。run_v4_red 以前は無効)"
    note: "scale_impedance は元の枝を 1 バンクとみなしてリアクタンスを台数で割る。容量は MVA を MW と同じに扱う。東北・関西・北陸・中国・四国・九州は台帳(変電所別の台数と設備容量)が無く対象外。MODEL_INTERVENTIONS.md への登録は別アクターの未コミット編集があるため保留"

branch_additions:
  kind: assumption
  value: []          # 感度用。例は docs/reports/nankai_hazard_2026-09-13/dynamics/README.md の「鹿島」参照
  note: "OSM 由来の経路が別の変電所を経由して繋がっている場合に、系統図の経路を直結で足す(既存の経路は残す)。鹿島: 東京電力 基幹系統図(open-keitouzu routes)では 香取線 鹿島→新佐原・鹿島線 鹿島→筑波南 だが、OSM では両線が神栖・泉川・鰐川の各変電所を経由して接続され、鰐川(A40 1〜2 m)の津波停止で鹿島の火力群 8 GW が孤立する(2026-09-18)。--set 'branch_additions.value=[{f: \"鹿島変電所 275kV\", t: \"新佐原変電所 275kV\", like_f: \"鰐川変電所 275kV\", like_t: \"新佐原変電所 275kV\", name: 香取線(系統図)}, {f: \"鹿島変電所 275kV\", t: \"筑波南変電所 275kV\", like_f: \"鰐川変電所 275kV\", like_t: \"筑波南変電所 275kV\", name: 鹿島線(系統図)}]'"

tsunami_site_rank:
  kind: assumption
  mode: max            # max = サイト内の母線(電圧ごとの点)で引いた A40 ランクの最大値(run_v8 までの既定)/ representative = 最高電圧の母線の地点の値(感度用)
  note: "鰐川 275 kV は地点の A40 が 0.3 m 未満(停止確率 5%)だが、320 m 離れた第 2 母線(1〜2 m)と同じサイトなので max では 85% になり、鹿島の火力群 8 GW の唯一の出口が 200 サンプル中 168 で止まる(2026-09-18 に判明)"
fragility_overrides: {}   # 感度用: fragility_default.yaml の値を部分的に上書き。例 --set 'fragility_overrides={"substation": {"tsunami": {"pfail_by_rank": {0: 0, 1: 0.025, 2: 0.25, 3: 0.425, 4: 0.49, 5: 0.49, 6: 0.49, 7: 0.49}}}}'

tsunami_exclude_boxes:
  kind: assumption
  value: []          # 感度用。例 [[35.28, 35.80, 139.60, 140.20]] = 東京湾の湾奥(浦賀水道より北)
  note: "国土数値情報 A40 は県ごとの最大クラスの包絡で、神奈川県の東京湾(川崎・横浜・横須賀)は県独自の慶長型地震が最大クラス(国土交通省 社会資本整備審議会 河川分科会 第52回 資料2-5 神奈川県沿岸における津波浸水想定 PDF p.14-16)。南海トラフ単独の浸水より大きい可能性がある。一方、神奈川県は南海トラフ最大クラスで「相模湾から東京湾内にかけて、2～9メートルの水位」とする。箱の中を 0 にするのは下限側の感度"

