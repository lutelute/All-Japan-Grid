# 南海トラフ巨大地震 シナリオ定義(合成GMPE用の近似震源域)
#
# 内閣府「南海トラフの巨大地震モデル検討会」の想定震源断層域(駿河湾〜日向灘、
# Mw9.0〜9.1)を、海溝軸(トラフ軸)と深部下端(深さ約30〜40km)の2本の折れ線で
# 近似したもの。内閣府の250mメッシュ震度分布(G空間情報センター・要登録)または
# J-SHIS のシナリオ震度メッシュが data/derived に置かれれば、そちらを優先し
# 本近似は使わない(hazard_field.MeshField を参照)。
#
# 折れ線座標は地理院地図・内閣府公表図からの目視近似(精度 ±20km)。confidence: low
scenario_id: nankai_mw90_basic_approx
name: 南海トラフ巨大地震(基本ケース近似・Mw9.0)
magnitude_mw: 9.0
# 司・翠川(1999)式は Mw8.3 程度までの回帰で、Mw9.0 をそのまま入れると遠方(大阪・名古屋・北陸)が
# 内閣府の震度分布より1階級ほど過大になる(2026-09-12 目視較正)。式に入れる有効Mwを飽和させる。
gmpe_effective_mw: 8.5
fault_centroid_depth_km: 20.0
fault_top_depth_km: 8.0
fault_bottom_depth_km: 35.0
# トラフ軸(北東=駿河湾 → 南西=日向灘)
trough_axis: [[35.05, 138.65], [34.55, 138.45], [33.95, 138.05], [33.45, 137.35],
              [33.05, 136.55], [32.65, 135.55], [32.40, 134.60], [32.15, 133.60],
              [31.95, 132.70], [31.65, 132.10], [31.25, 131.75]]
# 深部下端(陸側)。四国・紀伊半島南部・東海の直下を通る
downdip_edge: [[35.25, 138.30], [34.95, 137.85], [34.75, 137.20], [34.65, 136.55],
               [34.45, 135.90], [34.20, 135.35], [34.00, 134.55], [33.80, 133.60],
               [33.55, 132.75], [33.15, 132.10], [32.65, 131.60], [32.10, 131.30]]
gmpe:
  name: si_midorikawa_1999
  pgv_site_amplification: 1.6      # Vs600基盤→地表の平均的増幅(平野部想定)。J-SHIS AMP があれば置換
  pga_site_amplification: 1.2
  sigma_inter_log10: 0.12          # 地震間ばらつき(サンプル共通)
  sigma_intra_log10: 0.20          # 地震内ばらつき(空間相関つき)
  intra_correlation_km: 25.0
intensity:
  conversion: fujimoto_midorikawa_2005   # 計測震度 = 2.002 + 2.603 log10 PGV - 0.213 (log10 PGV)^2
tsunami:
  source: ksj_A40                  # 国土数値情報 津波浸水想定(都道府県の最大クラス)
  note: 沿岸各県の最大クラス津波(南海トラフ沿岸県はいずれも南海トラフ想定)。浸水深ランクを代表深に換算
