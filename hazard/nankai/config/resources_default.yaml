# 復旧に要する人手・資材・アセットの勘定(v0・仮定中心)。出典が無い値は confidence: low。
# 目的は「どの時点で何がどれだけ要るか」を系統モデルの復旧スケジュールから積み上げること。
crew:
  persons_per_crew: 8            # 1 作業班の人数(仮定)。熊本2016: 九州電力 最大3,600人+応援600人、能登2024: 応援1,000人/日
  hours_per_day: 10
# ジョブ種別ごとの資材(1 件あたり)。単位は自由記述。東日本大震災の東北電力 設備被害(主変90台・遮断器177・断路器403・鉄塔46基)を桁の目安にした仮定
materials:
  substation:
    ds3: {"断路器・遮断器 交換(台)": 2, "がいし(個)": 20, "制御ケーブル(km)": 0.5}
    ds4: {"主変圧器(台)": 1, "断路器・遮断器 交換(台)": 4, "がいし(個)": 40}
    tsunami: {"主変圧器(台)": 1, "制御盤・保護盤(面)": 6, "断路器・遮断器 交換(台)": 6}
  line:
    collapse: {"鉄塔(基)": 2, "電線(km)": 1.5, "がいし(個)": 60}
    tsunami: {"鉄塔(基)": 3, "電線(km)": 2.0, "がいし(個)": 80}
    short: {"がいし(個)": 10}
# 大型資材の調達リードタイム[日]と予備在庫(エリア別・台)。主変圧器は特注品で通常 1〜2 年、予備品と融通で対応(仮定)
lead_time_d: {"主変圧器(台)": 180, "鉄塔(基)": 30}
stock: {"主変圧器(台)": {chubu: 6, kansai: 8, kyushu: 6, chugoku: 4, shikoku: 2, hokuriku: 2, tokyo: 10, tohoku: 5, hokkaido: 3, okinawa: 1}}
# 電源車(移動発電機車): 上流孤立した変電所の需要に仮送電する。熊本2016 162台(応援110)・能登2024 34台・東日本 応援41台
generator_trucks:
  capacity_mw: 0.5
  fleet: {chubu: 40, kansai: 50, kyushu: 40, chugoku: 25, shikoku: 15, hokuriku: 10, tokyo: 60, tohoku: 30, hokkaido: 15, okinawa: 5}
  mutual_aid_factor: 2.0
  mutual_aid_start_d: 2.0
