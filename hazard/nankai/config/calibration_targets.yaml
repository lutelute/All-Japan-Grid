# =============================================================================
# hazard/nankai/config/calibration_targets.yaml
# 南海トラフ巨大地震 電力被害の公的想定値 (較正ターゲット)
#
# 内閣府 中央防災会議の 2013 年 (平成24年度 第二次報告) と 2025 年 (令和7年3月 新想定) の
# 電力関係の数値を原典 PDF から転記。ページは PDF 内のページ番号 (脚注の "- n -")。
# 全て confidence: high (原典 PDF を取得し pdftotext で本文から転記, 2026-09-13)。
# ただし表の列ラベルは原典の並び (電灯軒数 / 被災直後 / 1日後 / 4日後 / 1週間後) を
# そのまま採用したので、実装で照合すること。
#
# 単位: 軒 (電灯軒数ベース), 人, %, 万kW
# =============================================================================

meta:
  version: "0.1.0"
  created: "2026-09-13"
  regions:
    tokai:   {label: "①東海", prefs: [静岡, 愛知, 三重]}
    kinki:   {label: "②近畿", prefs: [和歌山, 大阪, 兵庫]}
    sanyo:   {label: "③山陽", prefs: [岡山, 広島, 山口]}
    shikoku: {label: "④四国", prefs: [徳島, 香川, 高知, 愛媛]}
    kyushu:  {label: "⑤九州", prefs: [大分, 宮崎]}
    all40:   {label: "合計 (40都府県)", note: "北海道・東北6県を除く40都府県"}
  tsunami_cases:
    "①": "東海地方が大きく被災するケース"
    "③": "近畿地方が大きく被災するケース"
    "④": "四国地方が大きく被災するケース"
    "⑤": "九州地方が大きく被災するケース"
  ground_motion_cases: ["基本ケース", "陸側ケース"]
  time_columns_outage: ["被災直後", "被災1日後", "被災4日後", "被災1週間後"]

