  restoration_forecast_95pct:
    page: 19
    note: "復旧対象電灯軒数は津波浸水により建物全壊した需要家を除外"
    narrative: >
      電力は、発災直後に需要側の被災と発電設備の被災により需給バランスが不安定になることを主要因として
      広域的に停電が発生する。電力供給の切り替え調整により、需給バランス等に起因した停電は数日間で解消される。
      電柱被害に基づく停電は、復旧に約1〜2週間を要する。
