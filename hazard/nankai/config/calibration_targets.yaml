  damage_scenario_assumptions_2013:
    source:
      title: "南海トラフ巨大地震対策検討ワーキンググループ (第6回) 資料2-1 (電力の被害想定及び被害様相①②; 平成24年度第二次報告より)"
      date: "2023-09-07"
      url: "https://www.bousai.go.jp/jishin/nankai/taisaku_wg_02/6/pdf/2-1.pdf"
      pages: "pp.7–8"
      confidence: high
    thermal_stop_rule: "震度6弱以上のエリア又は津波による浸水深数十cm以上となる火力発電所がおおむね運転を停止する (原子力は地震発生と同時に運転停止)"
    supply_capacity_immediately: "西日本 (60Hz) 全体の供給能力は、電力事業者間で広域的に電力を融通したとしても、電力需要 (夏季ピーク) の約5割しか確保できない"
    supply_capacity_1month: "停止した火力発電所が徐々に運転再開するため、西日本全体の供給能力は広域融通すれば電力需要の約9割まで回復"
    outage_cause_split: "停電全体のうちほとんどが需給バランス等に起因した停電であり、電柱 (電線) 被害に起因した停電は停電全体の1割以下"
    day1: "東海三県で約2〜8割、近畿三府県で約2割、山陽三県で最大約1割、四国で約8割、九州二県で約6〜8割の需要家が停電したまま"
    day3: "東海三県で約1〜5割、近畿三府県で最大約1割、四国で約2〜5割、九州二県で約2〜3割が停電したまま。山陽三県はほとんど解消"
    week1: "電柱 (電線) 被害等の復旧も進み、約9割以上の停電が解消"
    method_note: "内閣府 2025 手法概要 p.42: 「前回想定では東日本大震災や阪神・淡路大震災の実績から県別に停電率を設定していた」"

