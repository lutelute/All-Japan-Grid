# 4. 資源制約と復旧優先順位 (モデル既定値)
# -----------------------------------------------------------------------------
resource_limits:
  crews_per_utility:
    confidence: low
    note: >
      仮定。各社の実績動員 (阪神 関西 6,148 人ピーク, 熊本 九州 3,600+600 人, 能登 北陸 約1,000 人/日応援)
      と、災害時連携計画 (2020-07-10 に一般送配電 10 社が共同策定・経産省に提出) による相互応援を前提に置いた
      「送変電の復旧班数」の既定値。送変電 (変電所・送電線) の復旧班は配電要員とは別。
      災害時連携計画の要員・電源車の共同運用は OCCTO「災害時連携計画の確認における考慮事項について」
      2020-07 https://www.occto.or.jp/assets/oshirase/saigaijirenkei/files/200709_saigai_sankou.pdf に
      枠組み記載 (台数は非公表)。
    defaults:
      chubu:   {substation_crews: 40, line_crews: 30}
      kansai:  {substation_crews: 50, line_crews: 35}
      chugoku: {substation_crews: 25, line_crews: 20}
      shikoku: {substation_crews: 15, line_crews: 12}
      kyushu:  {substation_crews: 40, line_crews: 30}
      hokuriku: {substation_crews: 12, line_crews: 10}
      tokyo:   {substation_crews: 60, line_crews: 40}
    mutual_aid:
      start_day: 2
      multiplier_by_day: {2: 1.2, 4: 1.5, 7: 2.0}
      note: "熊本: 3/13 (発災2日後) から応援受入 [参考資料2 p.10]; 阪神: 1/18 に他電力 291 人 [能島 1997]"
    crew_days_per_repair:
      substation: {slight: 0.5, moderate: 2, extensive: 7, complete: 30}
      line_tower_temporary: 10
      confidence: low
      note: "仮定。HAZUS Table 8-27 の日数を 1 班当たりの所要とみなした。"
  generator_trucks:
    reference: {kumamoto_2016: 162, noto_2024: 34, tohoku_2011_aid: 41}
    note: "配電レベルの応急供給。送電モデルでは需要ノードの「仮復旧」として扱い、容量 (高圧電源車 ~500 kVA 級) から供給可能需要を上限にする。"
  priority_order:
    confidence: medium
    default: ["500kV", "275kV", "220kV", "187kV", "154kV", "110kV", "77kV", "66kV"]
    rationale: "上位系統から復旧して負荷を順次拾う運用が基本。ただし阪神では 275kV 変電所の被害が大きく、77kV 健全系統から復旧する方針に変更した [能島 1997 p.52]。実装では『健全な上位系統への最短経路』を優先し、電圧階級は同点処理に使う。"
    tie_breakers: ["下流に接続する需要 (MW) が大きい順", "発電機連系ノード優先 (ブラックスタート起点の水力)", "浸水・道路寸断でアクセス不能なノードは後回し"]
    out_of_scope: "病院・避難所等の重要施設優先 (配電レベル) は本モデルでは扱わない"
  access_constraints:
    note: "津波浸水域・道路寸断は復旧開始を遅らせる (熊本 阿蘇: 道路損壊で 11.9 日, 能登: 道路幅 2.5 m 確保が必要 [経産省 2024 p.4])。既定: 浸水深 >= 1 m のノードは開始遅延 +7 日 (仮定, low)。"
