# =============================================================================
# hazard/nankai/config/restoration.yaml
# 南海トラフ巨大地震 電力系統ハザードモデル: 復旧時間パラメータ
#
# 単位: 日。分布は各ブロックの dist で指定。
#   normal    : mean, sd (HAZUS 原典の表現)
#   lognormal : median, beta  (本モデルの標準形。HAZUS 値からの換算は derived と明記)
#   discrete  : 経過日数ごとの機能回復率 (内閣府/HAZUS の離散表)
# confidence の定義は fragility.yaml と同じ (high/medium/low)。
# 作成日 2026-09-13。
# =============================================================================

meta:
  version: "0.1.0"
  created: "2026-09-13"
  time_unit: days
  restoration_definition: >
    「機能回復」= 当該要素が定格の供給機能を回復 (仮復旧を含む)。需要家の停電解消は
    系統切替・仮送電・電源車を含む「応急送電」を基準とする (電力各社の停電戸数の定義に一致)。
  lognormal_from_normal_rule: "median = mean, beta = ln(1 + (sd/mean)^2)^0.5  (モーメント一致近似; derived)"

# -----------------------------------------------------------------------------
# 1. HAZUS 復旧関数 (原典そのまま)
# -----------------------------------------------------------------------------
hazus:
  source: >
    FEMA, Hazus Earthquake Model Technical Manual 4.2 SP3 (Oct 2020), §8.5.5 Component Restoration Curves,
    Table 8-27 "Restoration Functions for Electric Power System Components (All Normal Distributions)" と
    Table 8-28 "Discretized Restoration Functions for Electric Power Components", p.8-55。
    変電所と配電回線の復旧曲線は G&E (1994e)、発電施設は ATC-13 (1985) SF-29.a に基づく (原典本文)。
    https://www.fema.gov/sites/default/files/2020-10/fema_hazus_earthquake_technical_manual_4-2.pdf
  confidence: high
  note: >
    原典は正規分布 (mean, sd)。Table 8-27 の列見出しは "Median (days)" と "σ (days)" と印字されているが
    表題は "All Normal Distributions"。本ファイルでは mean として扱う。
  substations:
    dist: normal
    slight:    {mean: 1.0,  sd: 0.5}
    moderate:  {mean: 3.0,  sd: 1.5}
    extensive: {mean: 7.0,  sd: 3.5}
    complete:  {mean: 30.0, sd: 15.0}
    lognormal_equiv:   # derived (moment matching)
      slight:    {median: 1.0,  beta: 0.47}
      moderate:  {median: 3.0,  beta: 0.47}
      extensive: {median: 7.0,  beta: 0.47}
      complete:  {median: 30.0, beta: 0.47}
  distribution_circuits:
    dist: normal
    slight:    {mean: 0.3, sd: 0.2}
    moderate:  {mean: 1.0, sd: 0.5}
    extensive: {mean: 3.0, sd: 1.5}
    complete:  {mean: 7.0, sd: 3.0}
  generation_facilities:
    dist: normal
    slight:    {mean: 0.5,  sd: 0.1}
    moderate:  {mean: 3.6,  sd: 3.6}
    extensive: {mean: 22.0, sd: 21.0}
    complete:  {mean: 65.0, sd: 30.0}
  discretized_functional_pct:
    days: [1, 3, 7, 30, 90]
    substations:
      slight:    [50, 100, 100, 100, 100]
      moderate:  [9, 50, 100, 100, 100]
      extensive: [4, 13, 50, 100, 100]
      complete:  [3, 4, 7, 50, 100]
    distribution_circuits:
      slight:    [100, 100, 100, 100, 100]
      moderate:  [50, 100, 100, 100, 100]
      extensive: [9, 50, 100, 100, 100]
      complete:  [2, 10, 50, 100, 100]
    generation_facilities:
      slight:    [100, 100, 100, 100, 100]
      moderate:  [24, 44, 83, 100, 100]
      extensive: [16, 19, 24, 65, 100]
      complete:  [2, 2, 3, 13, 80]

# -----------------------------------------------------------------------------
# 2. モデル既定値 (要素種別 × 損傷状態)。HAZUS を出発点に日本の実績で上書き。
# -----------------------------------------------------------------------------
model_defaults:
  substations_shaking:
    dist: lognormal
    slight:    {median: 1.0,  beta: 0.5, confidence: medium, source: "HAZUS Table 8-27 と整合; 阪神で系統切替 2 時間・変電所復旧 (二次側母線充電) 26 時間 [能島 1997 p.52]"}
    moderate:  {median: 3.0,  beta: 0.5, confidence: medium, source: "HAZUS Table 8-27"}
    extensive: {median: 7.0,  beta: 0.5, confidence: medium, source: "HAZUS Table 8-27; 阪神 葺合変電所 (移動用変圧器で応急復旧) 1/21 02:00 = 4 日 [能島 1997 p.52]"}
    complete:  {median: 30.0, beta: 0.6, confidence: low, source: "HAZUS Table 8-27 (mean 30, sd 15)。日本での揺れ起因の complete は観測例なし。仮定"}
    note: >
      日本の実績では揺れ起因の変電所機能喪失はほぼ全て 1〜4 日以内に系統切替・移動用変圧器・
      予備品で応急復旧 (阪神: 供給支障 18 変電所, 1/18 08:00 までに変圧器二次側母線充電完了)。
      HAZUS の値をそのまま採用しつつ beta を 0.5 に広げた。
  substations_tsunami:
    dist: lognormal
    functional_failure: {median: 60.0, beta: 0.6, confidence: low}
    source: >
      仮定。アンカー: 東北電力は 2011-06-18 11:03 に「復旧作業に着手可能な地域の停電はすべて復旧」(99 日)
      [経産省提供資料 参考資料2 p.4]。津波被災 9 変電所の個別復旧日は未公表。津波で建屋流失した変電所は
      移設・新設で年単位 (南三陸町の例, 同 p.27) だが、需要家側も流失しているため供給機能としては
      仮設で代替される。
    note: "浸水深 2 m 以上 (fragility.yaml tsunami_substations complete) は median 90 日を推奨 (感度)"
  transmission_line_shaking:
    dist: lognormal
    insulator_or_conductor: {median: 2.0, beta: 0.6, confidence: medium, source: "東北電力 支持がいし折損の暫定対策 (懸垂がいし連追加) 2011-04 実施 [参考資料2 p.21]; 熊本 がいし折損 3 件は数日で復旧 [九州電力 2016]"}
    tower_collapse:         {median: 14.0, beta: 0.5, confidence: medium, source: "熊本: 66kV 黒川一の宮線の土砂崩れ区間を仮鉄塔 3 基・仮鉄柱 14 基 (約5 km) で 4/27 仮復旧 = 11.9 日 [経産省 2016-07-13 p.1, 九州電力 2016 p.30]; 胆振: 岩知志線 66kV 鉄塔 2 基倒壊 → 仮鉄柱で 9/13 応急復旧 = 7 日, ルート変更本復旧 12/2 [土木学会 2018 第10章 p.7]; 阪神: 有馬線 鉄塔損壊 → 仮鉄柱で 1/19 18:00 = 2.5 日 [能島 1997 p.52]"}
    note: "仮復旧 (仮鉄柱) の日数。用地交渉・道路啓開が律速 (熊本)。本復旧は数ヶ月。"
  transmission_line_tsunami:
    dist: lognormal
    tower_collapse: {median: 30.0, beta: 0.6, confidence: low, source: "仮定。東北電力 鉄塔 37 基 (津波) のうち 12 基が 2011-06 末までに復旧 (32%) [参考資料2 p.8] → 中央値は 100 日超と読めるが、鉄塔単位の復旧は線路ルート再構築 (50万V 北上幹線 6/18, 十和田幹線 6/25 前倒し運開) と一体なので線路レベルで 30–100 日と置く"}
  thermal_shaking:
    dist: discrete
    source: "fragility.yaml generation.thermal.japan_stop_rate_by_jma_intensity (内閣府 2025 手法概要 p.42) を復旧曲線として使う。停止率の時間推移 = 1 − 機能回復率"
    confidence: high
    summary_by_intensity:
      "5弱": "直後 8% 停止 → 3 日で全復旧"
      "5強": "直後 20% → 1 日 7% → 3 日 2% → 1 週 1% → 2 週 0%"
      "6弱/6強": "3 週間 90% 停止のまま → 1 ヶ月 23% → 5 週 6% → 6 週 0%"
      "7": "11 ヶ月まで 100% 停止 → 12 ヶ月で復旧"
    alternative_meti_2014_levels: "A (震度7) 1ヶ月程度以上 / B (6弱・6強) 1ヶ月程度以内 / C (5強以下) 1週間以内または継続 [電中研 湯山 2018 p.2]"
    boiler_tube_repair: {mean_days: 9, share_within_14days: 0.9, site_access_delay_days: 7, source: "経産省 2015-07-10 p.5", confidence: high}
    lognormal_equiv_for_6lower_6upper: {median: 28.0, beta: 0.3, note: "derived: 3 週間停止 → 6 週で全復旧 を lognormal に当てはめ"}
    lognormal_equiv_for_7: {median: 300.0, beta: 0.3, note: "derived"}
  thermal_tsunami:
    dist: discrete
    source: "fragility.yaml generation.thermal.tsunami_stop_rate_by_depth (内閣府 2025 手法概要 p.42)"
    confidence: high
    summary_by_depth:
      "0.3–1 m": "3 ヶ月まで 100% 停止 → 4 ヶ月で復旧"
      ">= 1 m":  "8 ヶ月まで 100% 停止 → 9 ヶ月で復旧"
    empirical_2011_days:
      source: "fragility.yaml generation.thermal.observed_2011_tsunami_plants (土木学会 報告書 + Wikipedia/東北電力プレス)"
      confidence: medium
      points:
        - {plant: "鹿島 4号", depth_m: "<=1", days: 21}
        - {plant: "鹿島 2,3,5,6号", depth_m: "<=1", days: "26–40"}
        - {plant: "常陸那珂 1号", depth_m: ">1", days: 65}
        - {plant: "広野 2,4号", depth_m: ">1", days: 125}
        - {plant: "新地 2号", depth_m: ">1", days: 283}
        - {plant: "仙台 4号", depth_m: 4.7, days: "284 (試運転) / 334 (営業)"}
        - {plant: "新地 1号", depth_m: ">1", days: 291}
        - {plant: "原町 2号", depth_m: 13.0, days: 749}
        - {plant: "原町 1号", depth_m: 13.0, days: 777}
    model_override_for_deep_inundation:
      depth_m_ge: 5.0
      dist: lognormal
      median: 500.0
      beta: 0.4
      confidence: low
      note: "仮定。内閣府表は 1 m 以上を一律 9 ヶ月とするが、原町 (13 m) は 2 年超。5 m 以上を別区分にする。"
    criepi_restoration_function:
      source: "電中研 湯山 2018 p.14: G(t|X) = Phi((ln t − Σ β_k X_k)/σ), β: 給排水(C) 1.12, 受電(C) 1.22, ボイラ(B) 1.41, 排煙(C) 1.30, 事務建屋・倉庫(A) 1.74, σ 0.54"
      confidence: medium
      note: "X_k は個別設備の被害有無 (0/1)。全て 0 のとき median = 1 日、全て 1 のとき median = exp(6.79) ≈ 890 日。設備別フラジリティ曲線 (PGA/浸水深) は同資料 p.11–13 に図示のみ (数値未公表)。"
  nuclear:
    dist: discrete
    default: {restoration_days: null, note: "時間軸内で再起動しない (内閣府 2025 と同じ)"}
    sensitivity: {restoration_days: 365, note: "感度ケース。規制判断に依存するため根拠なし (low)"}
    confidence: high
  hydro_pumped:
    dist: lognormal
    default: {restoration_days: 0, note: "停止しない (内閣府 2025)"}
    if_optional_outage_enabled: {median: 30.0, beta: 0.8, confidence: low, source: "仮定。熊本 黒川第一 (導水路埋没) は長期、他は数週間 [九州電力 2016 p.20]; 3.11 東北電力 水路 19 箇所中 9 が 2011-07-05 までに復旧 (116 日で 47%) [参考資料2 p.6]"}
  solar_wind_geothermal:
    rule: "thermal_shaking と同じ (内閣府 2025 手法概要 p.42)"
    confidence: medium

# -----------------------------------------------------------------------------
# 3. 日本の需要家停電の実績復旧曲線 (t = 発災からの日数, restored = 復旧率 = 1 − 停電戸数/最大停電戸数)
# -----------------------------------------------------------------------------
japan_empirical_curves:
  definition_note: >
    復旧率の定義は 能島 (岐阜大) の「復旧率 = (延べ停電戸数 − 停電戸数)/延べ停電戸数」に準ずる。
    電力各社の「停電戸数」は停止フィーダにぶら下がる戸数 (直接被害箇所数ではない) [虎谷 名古屋大 資料]。
    津波で家屋流失した需要家や立入制限区域は各社が復旧対象から除外している (時点により定義が変わる)。

  hanshin_1995_kepco:
    event: "兵庫県南部地震 1995-01-17 05:46, M7.2 (当時), 最大震度7"
    max_outage_households: 2600000
    points:
      - {t_days: 0.00, outage: 2600000, restored: 0.00, time: "1/17 05:46", note: "地震直後"}
      - {t_days: 0.07, outage: 1000000, restored: 0.62, time: "1/17 07:30", note: "系統切替 (77kV 健全系統から復旧, 275kV 上位からの方針を変更)"}
      - {t_days: 1.09, outage: 400000,  restored: 0.85, time: "1/18 08:00", note: "供給支障 18 変電所の変圧器二次側母線充電完了"}
      - {t_days: 1.47, outage: 260000,  restored: 0.90, time: "1/18 17:00"}
      - {t_days: 2.55, outage: 120000,  restored: 0.95, time: "1/19 19:00"}
      - {t_days: 6.39, outage: 0,       restored: 1.00, time: "1/23 15:04", note: "家屋倒壊などにより復旧できない需要家を除き応急送電完了"}
    sources:
      - "能島暢呂 (1997) 阪神・淡路大震災における電力・ガス施設の被害と復旧, 安全工学 35(1), pp.50–55 (図4 停電戸数の時間的推移; 7:30 100万, 1/18 8:00 40万, 1/23 15:00 完了) https://www.jstage.jst.go.jp/article/safety/35/1/35_50/_pdf/-char/en"
      - "関西電力「阪神・淡路大震災～応急送電までの7Days」 https://www.kepco.co.jp/energy_supply/supply/days/index.html (1/18 17:00 26万, 1/19 19:00 12万 は検索要約経由; medium)"
      - "内閣府 専門調査会 第1回 資料 p.1「発災6日後倒壊家屋等を除き復旧完了」"
    confidence: high
    resources:
      peak_field_staff: {n: 6148, date: "1995-01-21", breakdown: "ネットワーク技術 4,701 (社員 794, 電力各社 291, 協力会社 3,616); 発変電・送電・通信 2,519 (1/18)", source: "能島 1997 p.52"}
      substation_damage: "変電所 50 箇所被害 (主要 17), 供給支障 18 箇所"
      equipment_damage_summary: "電柱 (架空支持物) 11,289 基, 架空電線 7,760 径間, 柱上変圧器 5,346 台 [能島 1997 表1]"

  tohoku_2011_tohoku_epco:
    event: "東北地方太平洋沖地震 2011-03-11 14:46, M9.0, 最大震度7"
    max_outage_households: 4660000
    supply_loss_MW: 7900
