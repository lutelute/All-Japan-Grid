      - {t_days: 99.0, outage: 0, restored: 1.00, time: "6/18 11:03", note: "復旧作業に着手可能な地域の停電はすべて復旧"}
    sources:
      - "経済産業省提供資料 参考資料2「3月11日の地震により東北電力で発生した広域停電の概要」2011-09-10, pp.4, 11 (内閣府 東北地方太平洋沖地震を教訓とした地震・津波対策に関する専門調査会 第9回) https://www.bousai.go.jp/kaigirep/chousakai/tohokukyokun/9/pdf/sub2.pdf"
      - "内閣府 同専門調査会 第1回 資料「被害に関するデータ等」pp.1, 3 https://www.bousai.go.jp/kaigirep/chousakai/tohokukyokun/1/pdf/sub2.pdf"
      - "東北電力『東日本大震災復旧記録』2012-09 (支店別停止率・復旧日時) を引く 虎谷 (名古屋大) 資料 p.6"
    confidence: high
    resources:
      mutual_aid: {crew_person_days: 4200, generator_trucks: 41, generator_kVA: 18500, from: "2011-03-13", source: "参考資料2 p.10"}
      equipment_damage_summary: "変電所 75 箇所, 主要変圧器 90 台, 遮断器 177, 断路器 403; 鉄塔 37 基 (津波); 電柱 傾斜・倒壊 18,228 本 + 流失 15,681 本 (6/18 時点) [参考資料2 pp.7–9]"

  tohoku_2011_tepco:
    event: "同上 (東京電力管内, 最大震度6強)"
    max_outage_households: 4050000
    points:
      - {t_days: 0.00, outage: 4050000, restored: 0.00, time: "3/11 15:30"}
