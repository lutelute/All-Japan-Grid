findings_for_model:
  - "電力業界の津波評価は浸水深閾値の確率モデルではなく、変電所ごとの機器操作箱・端子台の設置高と想定浸水深の比較による決定論的判定(A10, A11, D06, D07)。耐水高の公表既定値は存在しない"
  - "上限側アンカー: 構内全面浸水 推定4m で屋内外機器使用不可(A28)、南三陸町の変電所は建屋流失(A27)"
  - "対策済み設備の耐水高で唯一公表された数値は新仙台3号系列の GL+3m(開閉所・遮断器)・重要設備2階以上・海側盛土約5m(B01–B03)"
  - "17万V以上の変電所は南海トラフ最過酷ケースで東京PG 0・中部PG 1・関西 3・四国 1 箇所の被災(A14–A18)、仮設備復旧10箇所・約147万kW・1週間程度(A19)"
  - "火力は内閣府2025の停止率表(0.3m/1m 境界, C08–C09)が電事連レベル区分(B10–B11)と同じ区切り。2011実績は 0.5〜1m で 9〜21日、1.5m で 65日、3〜5m で約9〜11か月、13m で約22か月(B17–B29)"
  - "需要側は浸水深2m以上で需要喪失(兵庫県 C06, TDGC C11)"
  - "現行モデルの変電所 1〜2m→85% は本調査でも直接根拠が得られず、既存 FRAGILITY_SOURCES.md 2.5節の『仮定(low)』のまま"
